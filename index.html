<style>

<script id="d-model" type="application/json">"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>AI Model Dashboard\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#0e1014; --panel:#161a22; --panel2:#1b2029; --line:#262d39;\n  --ink:#e7edf6; --mut:#94a0b2; --faint:#616b7a;\n  --cn:#f08a63; --oss:#5fb2f2; --closed:#aeb9c7;\n  --good:#74c97c; --grid:#1f2530;\n  --mono:\"SF Mono\",ui-monospace,Menlo,Consolas,monospace;\n  --sans:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Inter,Roboto,sans-serif;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1760px;margin:0 auto;padding:38px 28px 90px}\nh1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}\n.sub{color:var(--mut);font-size:14px;margin-bottom:30px}\n.sub b{color:var(--ink);font-weight:500}\nh2{font-size:18px;font-weight:600;margin:42px 0 5px;letter-spacing:-.01em}\n.note{color:var(--faint);font-size:14px;margin:0 0 16px;max-width:820px}\n.panel{background:linear-gradient(180deg,#171c25,#13171e);border:1px solid var(--line);border-radius:12px;padding:20px 20px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}\n/* scatter */\n.chartwrap{position:relative}\nsvg{display:block;width:100%;height:auto;overflow:visible}\n.axis{stroke:#39424f;stroke-width:1}\n.gridline{stroke:rgba(255,255,255,.05);stroke-width:1}\n.axislab{fill:var(--mut);font-size:14px;font-family:var(--sans)}\n.tick{fill:var(--faint);font-size:13px;font-family:var(--mono)}\n.frontier{fill:none;stroke:var(--good);stroke-width:1.7;stroke-dasharray:5 4;opacity:.9;stroke-linejoin:round;stroke-linecap:round}\n.dot{cursor:pointer;transition:r .12s ease,fill-opacity .12s}\n.dot.fr{filter:url(#glow)}\n.dot:hover{stroke:#fff;stroke-width:1.5}\n.dot.hot{r:8.5px;fill-opacity:1;stroke:#fff;stroke-width:2;filter:url(#glow)}\n.dlabel{fill:#c2ccd9;font-size:13px;font-family:var(--mono);pointer-events:none;paint-order:stroke;stroke:#0e1014;stroke-width:3px}\n.hotlabel{fill:#fff;font-size:14px;font-family:var(--sans);font-weight:600;pointer-events:none;paint-order:stroke;stroke:#0e1014;stroke-width:3.5px}\n.legend{display:flex;gap:20px;align-items:center;font-size:14px;color:var(--mut);margin:6px 2px 14px;flex-wrap:wrap}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}\n.tip{position:absolute;pointer-events:auto;background:rgba(10,12,16,.93);backdrop-filter:blur(4px);border:1px solid #313a48;\n  border-radius:9px;padding:11px 13px;font-size:14px;opacity:0;transition:opacity .08s;z-index:9;min-width:188px;box-shadow:0 8px 24px rgba(0,0,0,.5)}\n.tip b{font-weight:600}.tip .r{color:var(--mut);font-size:13px}\n.tip table{border-collapse:collapse;margin-top:6px}.tip td{padding:1.5px 0}.tip td:last-child{text-align:right;font-family:var(--mono);padding-left:16px}\n/* controls */\n.controls{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}\n.gfilters{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:9px}\ninput.search{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);\n  padding:8px 12px;font-size:14px;width:250px;font-family:var(--sans)}\ninput.search::placeholder{color:var(--faint)}\n.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:20px;\n  padding:6px 15px;font-size:14px;cursor:pointer;user-select:none}\n.chip.on{background:#23303f;border-color:#36506b;color:#cfe3f7}\n.cnt{color:var(--faint);font-size:14px;margin-left:auto;font-family:var(--mono)}\n/* table */\ntable.grid{width:100%;border-collapse:collapse;font-size:14px}\ntable.grid th,table.grid td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\ntable.grid th{position:sticky;top:0;background:var(--bg);color:var(--mut);font-weight:500;\n  text-align:right;cursor:pointer;user-select:none;font-size:14px}\ntable.grid th.l,table.grid td.l{text-align:left}\ntable.grid th:hover{color:var(--ink)}\ntable.grid td{text-align:right;font-family:var(--mono);color:var(--ink)}\ntable.grid td.l{font-family:var(--sans)}\ntable.grid tbody tr:hover td{background:#1c222c}\n.modelcell{font-weight:500;display:inline-block;max-width:280px;overflow:hidden;text-overflow:ellipsis;\n  white-space:nowrap;vertical-align:middle}\n.modelcell a.mlink{color:inherit;text-decoration:none}\n.modelcell a.mlink:hover{text-decoration:underline;text-decoration-color:var(--faint)}\n.modelcell.nomatch{color:var(--faint);font-weight:400}\n.linkrow{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}\n.mlink-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--sans);font-weight:600;\n  padding:1.5px 6px;border-radius:9px;text-decoration:none;border:1px solid transparent;\n  letter-spacing:.02em;transition:all .1s;opacity:.85}\n.mlink-chip:hover{opacity:1;transform:translateY(-1px)}\n.mlink-chip.or{background:rgba(95,178,242,.12);color:var(--oss);border-color:rgba(95,178,242,.3)}\n.mlink-chip.or:hover{background:rgba(95,178,242,.22)}\n.mlink-chip.aa{background:rgba(116,201,124,.12);color:var(--good);border-color:rgba(116,201,124,.3)}\n.mlink-chip.aa:hover{background:rgba(116,201,124,.22)}\n.mlink-chip svg{width:9px;height:9px}\n.tag{font-size:12px;font-family:var(--mono);padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:middle}\n.tag.cn{background:rgba(240,138,99,.18);color:var(--cn)}\n.tag.os{background:rgba(95,178,242,.18);color:var(--oss)}\n.crt{color:var(--mut);font-size:13.5px}\n.bar{position:relative}\n.bar span{position:absolute;left:0;top:0;bottom:0;background:rgba(116,201,124,.18);border-radius:2px;z-index:0}\n.bar em{position:relative;z-index:1;font-style:normal}\n.up{color:var(--faint)}\n.arrow{color:var(--good)}\n.tie1{color:var(--good);font-weight:600}\n.warnnote{color:var(--cn);font-size:13.5px;margin:0 0 12px}\n/* model card */\n.modelcell{cursor:pointer}\n.mcard{position:fixed;z-index:60;width:360px;max-width:calc(100vw - 16px);background:rgba(10,12,16,.97);\n  backdrop-filter:blur(4px);border:1px solid #313a48;border-radius:10px;padding:12px 14px;font-size:13.5px;\n  line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .08s;left:0;top:0}\n.mcard.on{opacity:1;visibility:visible}\n.mcard.pinned{border-color:#46607e;box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 0 1px rgba(124,156,242,.15)}\n.mc-h b{font-size:15px;font-weight:600}\n.mc-sub,.mc-facts{color:var(--mut);font-size:12.5px;margin-top:1px}\n.mc-facts{margin-top:6px}\n.mc-sec{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:11px 0 3px}\n.mc-t{width:100%;border-collapse:collapse}\n.mc-t td{padding:2px 0 2px 12px;font-family:var(--mono);text-align:right;white-space:nowrap}\n.mc-t td.l{text-align:left;font-family:var(--sans);padding-left:0;color:var(--mut)}\n.mc-t td.w{font-family:var(--sans);color:var(--mut);font-size:12.5px}\n.mc-t tr.hd td{color:var(--faint);font-family:var(--sans);font-size:11.5px}\n.mc-t tr.cur td{color:#fff;font-weight:600}\n.mc-t tr.cur td.l::before{content:'\u25b8 ';color:var(--good)}\n.mc-muted{color:var(--faint);font-size:12.5px;margin-top:3px}\n.mc-links{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}\n.mlink-chip.ar{background:rgba(148,160,178,.12);color:var(--mut);border-color:rgba(148,160,178,.3)}\nfooter{margin-top:48px;color:var(--faint);font-size:14px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}\nfooter a{color:var(--mut)}\n@media(max-width:720px){.wrap{padding:22px 14px}body{font-size:15.5px}.dlabel{display:none}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv class=\"wrap\">\n\u003ch1>AI Model Dashboard\u003c/h1>\n\u003cdiv class=\"sub\">Frontier language models &middot; intelligence, price &amp; speed &middot; as of \u003cb>2026-09-25 17:40 EDT\u003c/b>\n &middot; 673 AA models &times; 459 OpenRouter listings &times; 402 Arena ratings\u003c/div>\n\n\u003ch2>Price &times; Intelligence frontier\u003c/h2>\n\u003cp class=\"note\">Each dot is a model. Up = smarter (AA Intelligence Index). Left = cheaper (blended $/M tokens, 3:1 input:output, log scale).\nThe dashed line is the efficient frontier \u2014 the most intelligence available at each price. Models near it are the value plays.\u003c/p>\n\u003cdiv class=\"legend\">\n  \u003cspan>\u003ci style=\"background:var(--closed)\">\u003c/i>Closed / US &amp; other\u003c/span>\n  \u003cspan>\u003ci style=\"background:var(--oss)\">\u003c/i>Open-weight\u003c/span>\n  \u003cspan>\u003ci style=\"background:var(--cn)\">\u003c/i>Chinese lab\u003c/span>\n  \u003cspan style=\"color:var(--good)\">\u2013 \u2013 efficient frontier\u003c/span>\n\u003c/div>\n\u003cdiv class=\"panel chartwrap\">\u003cdiv id=\"scatter\">\u003c/div>\u003c/div>\n\n\u003ch2>Frontier \u2014 AA Intelligence Index &ge; 40\u003c/h2>\n\u003cp class=\"note\">Two independent reads on quality. \u003cb>Intel\u003c/b> is Artificial Analysis's benchmark composite: what the model scores on tests.\n\u003cb>Arena\u003c/b> is the blind human-preference rating from arena.ai's text leaderboard; \u003cb>WebDev\u003c/b> is the same for building web apps.\n\u003cspan class=\"tie1\">Green\u003c/span> = statistically tied for first: the votes can't separate it from the top-rated model. Hover any rating for its range.\nArena rates one variant per model family, so every effort level of a family shows that family's rating. Blank = not yet rated.\u003c/p>\n\n\u003cdiv class=\"gfilters\">\n  \u003cspan style=\"color:var(--mut);font-size:14px;font-weight:500;margin-right:4px\">Filters:\u003c/span>\n  \u003cspan class=\"chip on\" data-gf=\"small\">Hide &lt;12B params\u003c/span>\n  \u003cspan class=\"chip on\" data-gf=\"old\">Hide &gt;1yr old\u003c/span>\n  \u003cspan class=\"chip on\" data-gf=\"low\">Hide intel &lt; 20\u003c/span>\n  \u003cspan style=\"color:var(--faint);font-size:13.5px;margin-left:4px\">\u00b7 click to toggle \u00b7 applies to both tables\u003c/span>\n\u003c/div>\n\u003cdiv class=\"controls\">\n  \u003cinput class=\"search\" id=\"s1\" placeholder=\"filter models or labs\u2026\">\n  \u003cspan class=\"cnt\" id=\"c1\">\u003c/span>\n\u003c/div>\n\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"grid\" id=\"t1\">\u003c/table>\u003c/div>\n\n\u003ch2>Chinese &amp; open-weight models\u003c/h2>\n\u003cp class=\"note\">The models you can self-host or that ship open weights, plus everything from Chinese labs. Tap a chip to narrow.\u003c/p>\n\u003cdiv class=\"controls\">\n  \u003cinput class=\"search\" id=\"s2\" placeholder=\"filter\u2026\">\n  \u003cspan class=\"chip on\" data-f=\"all\">All\u003c/span>\n  \u003cspan class=\"chip\" data-f=\"china\">Chinese\u003c/span>\n  \u003cspan class=\"chip\" data-f=\"open\">Open-weight\u003c/span>\n  \u003cspan class=\"cnt\" id=\"c2\">\u003c/span>\n\u003c/div>\n\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"grid\" id=\"t2\">\u003c/table>\u003c/div>\n\n\u003cfooter>\nData: model quality, throughput, latency &amp; pricing from\n\u003ca href=\"https://artificialanalysis.ai/\" target=\"_blank\" rel=\"noopener\">Artificial Analysis\u003c/a>\n(Intelligence Index v4); context window &amp; open-weight signal from\n\u003ca href=\"https://openrouter.ai/\" target=\"_blank\" rel=\"noopener\">OpenRouter\u003c/a>;\nhuman-preference ratings from \u003ca href=\"https://arena.ai/leaderboard\" target=\"_blank\" rel=\"noopener\">Arena\u003c/a>\n(text, style-controlled; WebDev), joined to AA at model-family level.\nThroughput = AA median output tokens/sec; latency = median time-to-first-token.\nBlended price weights input:output 3:1. Intelligence-per-$ = index &divide; blended $/M.\nRegenerated daily. Generated 2026-09-25 17:40 EDT.\n\u003c/footer>\n\u003c/div>\n\u003cscript>\nconst DATA = [{\"name\": \"GLM-4.5V (Non-reasoning)\", \"creator\": \"Z AI\", \"slug\": \"glm-4-5v\", \"release\": \"2025-08-11\", \"params\": null, \"intel\": 6.7, \"coding\": null, \"agent\": null, \"p_in\": 0.6, \"p_out\": 1.8, \"blended\": 0.9, \"tput\": 47.71, \"ttft\": 2.78, \"ctx\": 65536, \"kcut\": \"2024-12-31\", \"ipd\": 7.44, \"china\": true, \"open\": true, \"or_id\": \"z-ai/glm-4.5v\", \"ar_text\": 1353, \"ar_webdev\": null, \"arena\": {\"text\": {\"r\": 1353, \"ci\": 8, \"hi\": 187, \"lo\": 223, \"v\": 4817, \"n\": \"glm-4.5v\"}, \"coding\": {\"r\": 1404, \"ci\": 19, \"hi\": 168, \"lo\": 230, \"v\": 968, \"n\": \"glm-4.5v\"}, \"hard\": {\"r\": 1374, \"ci\": 12, \"hi\": 178, \"lo\": 221, \"v\": 2348, \"n\": \"glm-4.5v\"}, \"vision\": {\"r\": 1154, \"ci\": 12, \"hi\": 93, \"lo\": 112, \"v\": 3255, \"n\": \"glm-4.5v\"}}}, {\"name\": \"Gemini 3.5 Flash (high)\", \"creator\": \"Google\", \"slug\": \"gemini-3-5-flash\", \"release\": \"2026-05-19\", \"params\": null, \"intel\": 32.6, \"coding\": 70.1, \"agent\": 26.0, \"p_in\": 1.5, \"p_out\": 9.0, \"blended\": 3.375, \"tput\": 238.01, \"ttft\": 16.98, \"ctx\": 1048576, \"kcut\": \"2025-01-01\", \"ipd\": 9.66, \"china\": false, \"open\": false, \"or_id\": \"google/gemini-3.5-flash\", \"ar_text\": 1478, \"ar_webdev\": 1499, \"arena\": {\"text\": {\"r\": 1478, \"ci\": 4, \"hi\": 14, \"lo\": 40, \"v\": 38257, \"n\": \"gemini-3.5-flash-high\"}, \"coding\": {\"r\": 1506, \"ci\": 7, \"hi\": 30, \"lo\": 81, \"v\": 11109, \"n\": \"gemini-3.5-flash-high\"}, \"hard\": {\"r\": 1495, \"ci\": 5, \"hi\": 17, \"lo\": 50, \"v\": 25628, \"n\": \"gemini-3.5-flash-high\"}, \"webdev\": {\"r\": 1499, \"ci\": 7, \"hi\": 47, \"lo\": 54, \"v\": 9530, \"n\": \"gemini-3.5-flash-high\"}, \"vision\": {\"r\": 1284, \"ci\": 8, \"hi\": 6, \"lo\": 31, \"v\": 9579, \"n\": \"gemini-3.5-flash-high\"}, \"document\": {\"r\": 1463, \"ci\": 8, \"hi\": 12, \"lo\": 29, \"v\" lease date lives in the\n// model-name tooltip rather than a column: it cost width on every row and the\n// \"Hide >1yr old\" filter already acts on it.\nconst C={\n  name:   {k:'name',  t:'Model',     l:1, r:d=>modelCell(d)},\n  params: {k:'params', t:'Params',   r:d=>d.params!=null?d.params+'B':'\u00b7'},\n  intel:  {k:'intel', t:'Intel',     bar:'intel', r:d=>fmt(d.intel,1)},\n  coding: {k:'coding',t:'Code',      r:d=>fmt(d.coding,1)},\n  agent:  {k:'agent', t:'Agent',     r:d=>fmt(d.agent,1)},\n  ar_text:{k:'ar_text',  t:'Arena',  r:d=>arenaCell(d,'text')},\n  ar_web: {k:'ar_webdev',t:'WebDev', r:d=>arenaCell(d,'webdev')},\n  ctx:    {k:'ctx',   t:'Context',   r:d=>ctxf(d.ctx)},\n  p_in:   {k:'p_in',  t:'$ In',      r:d=>money(d.p_in)},\n  p_out:  {k:'p_out', t:'$ Out',     r:d=>money(d.p_out)},\n  blended:{k:'blended',t:'Blended',  r:d=>money(d.blended)},\n  tput:   {k:'tput',  t:'Tok/s',     r:d=>fmt(d.tput,0)},\n  ttft:   {k:'ttft',  t:'TTFT s',    r:d=>fmt(d.ttft,2)},\n  ipd:    {k:'ipd',   t:'Intel/$',   bar:'ipd', r:d=>fmt(d.ipd,1)},\n};\nconst pick=ks=>ks.map(k=>C[k]);\n// Frontier: frontier labs don't publish parameter counts (0 of the rows have\n// one) and context is 0.5\u20131.3M across the board, so both columns are dropped.\nconst COLS_FRONTIER=pick(['name','intel','coding','agent','ar_text','ar_web','p_in','p_out','blended','tput','ttft','ipd']);\n// Open & Chinese: params matter for self-hosting and context ranges 8K\u20131.3M.\nconst COLS_OSS=pick(['name','params','intel','coding','agent','ar_text','ar_web','ctx','p_in','p_out','blended','tput','ttft','ipd']);\nfunction modelLinks(d){\n  let l='\u003cspan class=\"linkrow\">';\n  l+=`\u003ca class=\"mlink-chip aa\" href=\"https://artificialanalysis.ai/models/${encodeURIComponent(d.slug||'')}\" target=\"_blank\" rel=\"noopener\" title=\"Artificial Analysis model page\" onclick=\"event.stopPropagation()\">${AA_ICON}AA\u003c/a>`;\n  l+='\u003c/span>';\n  return l;\n}\n// AA spells effort levels \"(Adaptive Reasoning, Xhigh Effort, Default Fallback)\"\n// (Anthropic) or \"(Reasoning, Max Effort)\" (DeepSeek and others), which truncates\n// to the same prefix on every row and hides the one word that tells them apart.\n// Show \"(xhigh)\", as AA already does for GPT/Grok; non-reasoning variants keep\n// that qualifier. The model card shows the same short name; AA's page has the full one.\nconst shortName=n=>(n||'').replace(/\\((Adaptive Reasoning|Reasoning|Non-?reasoning),\\s*(\\w+)\\s+Effort(?:,[^)]*)?\\)/i,\n  (m,k,e)=>/^non/i.test(k)?`(non-reasoning, ${e.toLowerCase()})`:`(${e.toLowerCase()})`);\nfunction modelCell(d){let t='';if(d.china)t+='\u003cspan class=\"tag cn\">CN\u003c/span>';if(d.open)t+='\u003cspan class=\"tag os\">OSS\u003c/span>';\n  // The name opens the model card (hover) and pins it (click); the OpenRouter\n  // link moved into the card. No native title tooltip: two at once is worse.\n  const cls=d.or_id?'modelcell':'modelcell nomatch';\n  return `\u003cspan class=\"${cls}\">${escA(shortName(d.name))}\u003c/span>${t}${modelLinks(d)}`;}\nfunction maxOf(rows,k){return Math.max(...rows.map(r=>r[k]||0))||1;}\nconst escA=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nconst ARENA_BOARD={text:'Arena text',webdev:'Arena WebDev'};\nconst ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');\n// Rating only, so the column stays right-aligned. Arena's rank band\n// (rankUpper..rankLower) becomes one visual state: green = the votes can't\n// separate this model from #1. The full band is spelled out in the tooltip.\nfunction arenaCell(d,b){const a=(d.arena||{})[b];\n  if(!a) return `\u003cspan class=\"up\" title=\"Not yet rated on the ${ARENA_BOARD[b]} leaderboard\">\u00b7\u003c/span>`;\n  const top=a.hi===1;\n  const where=a.hi===a.lo?`Ranked ${ord(a.hi)}.`\n    :`Could rank anywhere from ${ord(a.hi)} to ${ord(a.lo)}: the votes can't separate it from the models in that range.`;\n  const t=`${ARENA_BOARD[b]} rating ${a.r} (\u00b1${a.ci}). ${where}${top?' Statistically tied for first.':''} `+\n          `${fmt(a.v)} votes. Rated variant: ${a.n}.`;\n  return `\u003cspan class=\"${top?'tie1':''}\" title=\"${escA(t)}\">${a.r}\u003c/span>`;}\n\n/* ---------- model card ----------\n   One card per model, shared by table rows and chart dots. Hover shows it\n   (hidden after 150 ms so the pointer can travel into it), click or tap pins\n   it, Esc or a click elsewhere unpins. #m=\u003cslug> opens one pinned on load. */\nconst BOARDS=[['webdev','WebDev'],['text','Text'],['coding','Coding'],['hard','Hard prompts'],\n              ['vision','Vision'],['search','Search'],['document','Document']];\nconst EFFORT_ORDER=['max','xhigh','high','medium','low','minimal'];\nconst MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst baseName=n=>shortName(n).replace(/\\s*\\([^)]*\\)\\s*$/,'').trim();\nconst effortOf=n=>{const m=shortName(n).match(/\\(([^)]*)\\)\\s*$/);return m?m[1]:'\u2014';};\n// Family = same lab + same name once the trailing effort parenthetical is gone.\n// Built from DATA (every model), so the ladder includes variants under the cutoff.\nconst FAM={}, BYSLUG={};\nDATA.forEach(d=>{const k=(d.creator||'')+'|'+baseName(d.name);(FAM[k]=FAM[k]||[]).push(d);\n  if(d.slug) BYSLUG[d.slug]=d;});\nconst famOf=d=>FAM[(d.creator||'')+'|'+baseName(d.name)]||[d];\nfunction rankWords(a){\n  if(a.hi===1&&a.lo===1) return '\u003cspan class=\"tie1\">1st\u003c/span>';\n  if(a.hi===1) return '\u003cspan class=\"tie1\">tied for 1st\u003c/span>';\n  if(a.hi===a.lo) return ord(a.hi);\n  return `could be ${ord(a.hi)}\u2013${ord(a.lo)}`;}\nfunction monthYear(iso){const m=/^(\\d{4})-(\\d{2})/.exec(iso||'');return m?MON[+m[2]-1]+' '+m[1]:null;}\nfunction releasedText(iso){\n  const t=new Date((iso||'')+'T00:00:00'); if(isNaN(t)) return null;\n  const days=Math.max(0,Math.round((Date.now()-t)/864e5));\n  const yr=t.getFullYear()!==new Date().getFullYear()?' '+t.getFullYear():'';\n  return `Released ${MON[t.getMonth()]} ${t.getDate()}${yr} \u00b7 ${days===0?'today':days===1?'1 day ago':days+' days ago'}`;}\nfunction cardHtml(d){\n  let h=`\u003cdiv class=\"mc-h\">\u003cb>${escA(shortName(d.name))}\u003c/b>${d.china?'\u003cspan class=\"tag cn\">CN\u003c/span>':''}\u003c/div>`;\n  h+=`\u003cdiv class=\"mc-sub\">${escA([d.creator,d.open?'open weights':'closed'].filter(Boolean).join(' \u00b7 '))}\u003c/div>`;\n  const f=[], rel=releasedText(d.release), kc=monthYear(d.kcut);\n  if(rel) f.push(rel);\n  if(kc) f.push('knowledge to '+kc);\n  if(d.ctx) f.push(ctxf(d.ctx)+' context');\n  if(d.params!=null) f.push(d.params+'B params');\n  if(f.length) h+=`\u003cdiv class=\"mc-facts\">${escA(f.join(' \u00b7 '))}\u003c/div>`;\n  const ar=d.arena||{}, rated=BOARDS.filter(([b])=>ar[b]), un=BOARDS.filter(([b])=>!ar[b]);\n  h+=`\u003cdiv class=\"mc-sec\">Arena \u2014 where people prefer it\u003c/div>`;\n  if(!rated.length) h+=`\u003cdiv class=\"mc-muted\">Not yet rated on Arena\u003c/div>`;\n  else {\n    h+='\u003ctable class=\"mc-t\">'+rated.map(([b,l])=>{const a=ar[b];\n      return `\u003ctr>\u003ctd class=\"l\">${l}\u003c/td>\u003ctd>${a.r}\u003c/td>\u003ctd class=\"w\">${rankWords(a)}\u003c/td>\u003c/tr>`;}).join('')+'\u003c/table>';\n    if(un.length) h+=`\u003cdiv class=\"mc-muted\">Not rated: ${un.map(x=>x[1]).join(', ')}\u003c/div>`;\n  }\n  const fam=famOf(d);\n  if(fam.length>=2){\n    const er=x=>{const i=EFFORT_ORDER.indexOf(effortOf(x.name).toLowerCase());return i\u003c0?99:i;};\n    let rows=[...fam].sort((a,b)=>er(a)-er(b)||(b.intel||0)-(a.intel||0));\n    if(rows.length>8){const cur=rows.find(x=>x.slug===d.slug); rows=rows.slice(0,8);\n      if(cur&&!rows.includes(cur)) rows[7]=cur;}\n    const tt=x=>x.ttft==null?'\u00b7':fmt(x.ttft,x.ttft\u003c10?1:0)+'s';\n    h+=`\u003cdiv class=\"mc-sec\">Effort levels\u003c/div>\u003ctable class=\"mc-t\">`+\n       `\u003ctr class=\"hd\">\u003ctd class=\"l\">\u003c/td>\u003ctd>Intel\u003c/td>\u003ctd>Blended\u003c/td>\u003ctd>First token\u003c/td>\u003c/tr>`+\n       rows.map(x=>`\u003ctr class=\"${x.slug===d.slug?'cur':''}\">\u003ctd class=\"l\">${escA(effortOf(x.name))}\u003c/td>`+\n         `\u003ctd>${fmt(x.intel,1)}\u003c/td>\u003ctd>${money(x.blended)}\u003c/td>\u003ctd>${tt(x)}\u003c/td>\u003c/tr>`).join('')+'\u003c/table>';\n  }\n  h+=`\u003cdiv class=\"mc-links\">\u003ca class=\"mlink-chip aa\" href=\"https://artificialanalysis.ai/models/${encodeURIComponent(d.slug||'')}\" target=\"_blank\" rel=\"noopener\">${AA_ICON}AA\u003c/a>`+\n     (d.or_id?`\u003ca class=\"mlink-chip or\" href=\"https://openrouter.ai/${escA(d.or_id)}\" target=\"_blank\" rel=\"noopener\">${OR_ICON}OpenRouter\u003c/a>`:'')+\n     `\u003ca class=\"mlink-chip ar\" href=\"https://arena.ai/leaderboard/text\" target=\"_blank\" rel=\"noopener\">${OR_ICON}Arena\u003c/a>\u003c/div>`;\n  return h;}\n\nconst CARD=document.createElement('div'); CARD.className='mcard'; document.body.appendChild(CARD);\nlet cardFor=null, cardAnchor=null, pinned=false, cardHideT=null;\nfunction placeCard(a){\n  const r=a.getBoundingClientRect(), vw=innerWidth, vh=innerHeight, cw=CARD.offsetWidth, ch=CARD.offsetHeight;\n  let x=r.right+10, y=r.top-8;\n  if(x+cw>vw-8) x=r.left-cw-10;          // flip left\n  if(x\u003c8) x=Math.max(8,Math.min(vw-cw-8,r.left)), y=r.bottom+8;   // no room either side: go below\n  if(y+ch>vh-8) y=vh-ch-8;               // flip up\n  CARD.style.left=Math.max(8,x)+'px'; CARD.style.top=Math.max(8,y)+'px';}\nfunction openCard(d,a){ if(!cardFor||cardFor.slug!==d.slug){CARD.innerHTML=cardHtml(d);}\n  cardFor=d; cardAnchor=a; CARD.classList.add('on'); placeCard(a);}\nfunction showCard(d,a){ if(pinned) return; clearTimeout(cardHideT); openCard(d,a);}\nfunction hideCardSoon(){ if(pinned) return; clearTimeout(cardHideT);\n  cardHideT=setTimeout(()=>{CARD.classList.remove('on'); cardFor=cardAnchor=null;},150);}\nfunction pinCard(d,a){ clearTimeout(cardHideT); pinned=true; CARD.classList.add('pinned'); openCard(d,a);}\nfunction unpinCard(){ pinned=false; CARD.classList.remove('pinned','on'); cardFor=cardAnchor=null;}\nfunction togglePin(d,a){ if(pinned&&cardFor&&cardFor.slug===d.slug) unpinCard(); else { pinned=false; pinCard(d,a);} }\nCARD.addEventListener('mouseenter',()=>clearTimeout(cardHideT));\nCARD.addEventListener('mouseleave',hideCardSoon);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape') unpinCard();});\ndocument.addEventListener('click',e=>{ if(pinned&&!CARD.contains(e.target)&&!e.target.closest('[data-card]')) unpinCard();});\naddEventListener('scroll',()=>{ if(!CARD.classList.contains('on')||!cardAnchor) return;\n  if(pinned) placeCard(cardAnchor); else {CARD.classList.remove('on'); cardFor=cardAnchor=null;} },{passive:true});\nfunction openFromHash(){\n  const m=/^#m=(.+)$/.exec(location.hash); if(!m) return;\n  const slug=decodeURIComponent(m[1]), d=BYSLUG[slug]; if(!d) return;\n  const q=`tr[data-key=\"${CSS.escape(slug.replace(/\"/g,''))}\"] .modelcell`;\n  const cell=document.querySelector('#t1 '+q)||document.querySelector('#t2 '+q);\n  if(cell){ cell.closest('tr').scrollIntoView({block:'center'}); pinned=false; pinCard(d,cell);} }\n\nconst TODAY_MS=Date.now(),ONE_YEAR_MS=365*24*3600*1000;\nconst gfState={small:true,old:true,low:true};\nfunction gfMatch(d){\n  if(gfState.small && d.params!=null && d.params\u003c12) return false;\n  if(gfState.old && d.release){if(TODAY_MS-new Date(d.release).getTime()>ONE_YEAR_MS) return false;}\n  if(gfState.low && d.intel!=null && d.intel\u003c20) return false;\n  return true;\n}\nfunction makeTable(elId,rows,state){\n  const el=document.getElementById(elId);\n  const mx={intel:maxOf(rows,'intel'),ipd:maxOf(rows,'ipd')};\n  function render(){\n    let view=rows.filter(d=>state.filter(d)&&gfMatch(d));\n    if(state.q){const q=state.q.toLowerCase();\n      view=view.filter(d=>(d.name+' '+(d.creator||'')).toLowerCase().includes(q));}\n    if(state.sort){const {k,dir}=state.sort;\n      view=[...view].sort((a,b)=>{let x=a[k],y=b[k];\n        if(typeof x==='string'||typeof y==='string'){x=(x||'');y=(y||'');return dir*((x>y)-(x\u003cy));}\n        x=(x==null?-Infinity:x);y=(y==null?-Infinity:y);return dir*(x-y);});}\n    let h='\u003cthead>\u003ctr>'+state.cols.map(c=>{const ar=state.sort&&state.sort.k===c.k?(state.sort.dir>0?' \u2191':' \u2193'):'';\n      return `\u003cth class=\"${c.l?'l':''}\" data-k=\"${c.k}\">${c.t}\u003cspan class=\"arrow\">${ar}\u003c/span>\u003c/th>`;}).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n    h+=view.map(d=>`\u003ctr data-key=\"${(d.slug||'').replace(/\"/g,'')}\">`+state.cols.map(c=>{let inner=c.r(d);\n        if(c.bar){const w=Math.max(0,((d[c.bar]||0)/mx[c.bar])*100);\n          inner=`\u003cspan class=\"bar\">\u003cspan style=\"width:${w}%\">\u003c/span>\u003cem>${inner}\u003c/em>\u003c/span>`;}\n        return `\u003ctd class=\"${c.l?'l':''}\">${inner}\u003c/td>`;}).join('')+'\u003c/tr>').join('');\n    h+='\u003c/tbody>';\n    el.innerHTML=h;\n    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;\n      state.sort=(state.sort&&state.sort.k===k)?{k,dir:-state.sort.dir}:{k,dir:-1};render();});\n    el.querySelectorAll('tbody tr').forEach((tr,i)=>{\n      const d=view[i], cell=tr.querySelector('.modelcell');\n      if(cell){ cell.dataset.card='1';\n        cell.onmouseenter=()=>showCard(d,cell);\n        cell.onmouseleave=hideCardSoon;\n        cell.onclick=e=>{e.stopPropagation(); togglePin(d,cell);}; }\n      tr.onmouseenter=()=>window.HI&&window.HI(tr.dataset.key);\n      tr.onmouseleave=()=>window.UN&&window.UN(tr.dataset.key);});\n    if(state.cnt)document.getElementById(state.cnt).textContent=view.length+' models';\n  }\n  state.render=render; render();\n}\n\nconst st1={sort:{k:'intel',dir:-1},q:'',filter:()=>true,cnt:'c1',cols:COLS_FRONTIER};\nmakeTable('t1',OVERALL,st1);\ndocument.getElementById('s1').oninput=e=>{st1.q=e.target.value;st1.render();};\n\nconst CNOSS=DATA.filter(d=>d.china||d.open).filter(d=>d.intel!=null).sort((a,b)=>b.intel-a.intel);\nconst st2={sort:{k:'intel',dir:-1},q:'',filter:()=>true,cnt:'c2',cols:COLS_OSS};\nmakeTable('t2',CNOSS,st2);\nopenFromHash(); addEventListener('hashchange',openFromHash);\ndocument.getElementById('s2').oninput=e=>{st2.q=e.target.value;st2.render();};\ndocument.querySelectorAll('[data-f]').forEach(ch=>ch.onclick=()=>{\n  document.querySelectorAll('[data-f]').forEach(c=>c.classList.remove('on'));ch.classList.add('on');\n  const f=ch.dataset.f;\n  st2.filter = f==='china'?(d=>d.china) : f==='open'?(d=>d.open) : (()=>true);\n  st2.render();});\ndocument.querySelectorAll('[data-gf]').forEach(ch=>ch.onclick=()=>{\n  const f=ch.dataset.gf; gfState[f]=!gfState[f];\n  ch.classList.toggle('on',gfState[f]);\n  st1.render(); st2.render();});\n\u003c/script>\n\u003c/body>\u003c/html>"</script>

h(m=>{\n      if(!modelMap[m.name]) modelMap[m.name]={creator:m.creator,apps:new Array(APPS.length).fill(0),count:0};\n      modelMap[m.name].apps[ai]=m.tokens;\n      modelMap[m.name].count++;\n    });\n  });\n  return {modelMap,appNames:names};\n}\n\nfunction setActive(el) {\n  document.querySelectorAll('.app-item').forEach(e=>e.classList.remove('active'));\n  el.classList.add('active');\n}\n\nfunction renderSidebar() {\n  const list=document.getElementById('app-list');\n  APPS.forEach((app,i)=>{\n    const el=document.createElement('div');\n    el.className='app-item'; el.dataset.slug=app.slug;\n    el.innerHTML=`\n      \u003cdiv class=\"rank-badge ${i===0?'r1':''}\">${app.rank}\u003c/div>\n      \u003cdiv class=\"app-name\">${app.name}\u003c/div>\n      ${app.trend?`\u003cdiv class=\"trend ${app.trend.startsWith('-')?'down':'up'}\">${app.trend}\u003c/div>`:''}\n      \u003cdiv class=\"app-tokens\">${app.todayTokens||''}\u003c/div>`;\n    el.onclick=()=>showApp(app,el);\n    list.appendChild(el);\n  });\n}\n\nfunction showOverview(el) {\n  setActive(el);\n  const {modelMap,appNames}=buildCross();\n  const sorted=Object.entries(modelMap).sort((a,b)=>\n    b[1].count-a[1].count||(b[1].apps.reduce((s,v)=>s+v,0)-a[1].apps.reduce((s,v)=>s+v,0)));\n  const top15=sorted.slice(0,15);\n  const appTotals=APPS.map(app=>(app.models||[]).reduce((s,m)=>s+m.tokens,0));\n  const grandTotal=appTotals.reduce((s,v)=>s+v,0);\n  const creatorTotals={};\n  APPS.forEach(app=>(app.models||[]).forEach(m=>{\n    creatorTotals[m.creator]=(creatorTotals[m.creator]||0)+m.tokens;\n  }));\n  const allTok=Object.values(creatorTotals).reduce((s,v)=>s+v,0);\n  const topC=Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1])[0]||['?',0];\n  const topCpct=allTok?Math.round(topC[1]/allTok*100):0;\n  const mu=sorted[0]||['?',{count:0}];\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"section-title\">Cross-App Insights\u003c/div>\n    \u003cdiv class=\"insights-grid\">\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Most Universal Model\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:15px;color:#4a9eff\">${mu[0]}\u003c/div>\n        \u003cdiv class=\"sub\">In ${mu[1].count}/${APPS.length} apps with model data\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Dominant Creator\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:18px;color:${CREATORS[topC[0]]||'#fff'}\">${topC[0][0]?.toUpperCase()+topC[0].slice(1)}\u003c/div>\n        \u003cdiv class=\"sub\">${topCpct}% of cross-app token volume\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Total Token Volume\u003c/div>\n        \u003cdiv class=\"value\">${fmtT(Math.round(allTok))}\u003c/div>\n        \u003cdiv class=\"sub\">Across top ${APPS.length} apps this month\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"heatmap-wrap\">\n      \u003ch2>Model \u00d7 App Heatmap\u003c/h2>\n      \u003cp class=\"desc\">Top 15 models by breadth. Cell shading = token volume relative to that model's biggest app (row-normalized). Total column = model's tokens across these apps; App total row = each app's tokens across all its models.\u003c/p>\n      \u003ctable class=\"heatmap\">\n        \u003cthead>\u003ctr>\n          \u003cth class=\"model-col\">Model\u003c/th>\u003cth>Creator\u003c/th>\u003cth>Apps\u003c/th>\n          ${appNames.map(n=>`\u003cth>${n}\u003c/th>`).join('')}\u003cth class=\"total-col\">Total\u003c/th>\n        \u003c/tr>\u003c/thead>\n        \u003ctbody>\n          ${top15.map(([name,data])=>{\n            const maxT=Math.max(...data.apps)||1;\n            return `\u003ctr>\n              \u003ctd class=\"model-name\">\u003cspan class=\"cdot\" style=\"background:${CREATORS[data.creator]||'#555'}\">\u003c/span>${name}\u003c/td>\n              \u003ctd style=\"color:${CREATORS[data.creator]||'#999'};font-size:13px\">${data.creator}\u003c/td>\n              \u003ctd style=\"color:#a78bfa;font-weight:700\">${data.count}\u003c/td>\n              ${data.apps.map(t=>{\n                if(!t) return `\u003ctd>\u003cspan class=\"heat-cell heat-0\">\u2013\u003c/span>\u003c/td>`;\n                const lv=Math.min(5,Math.ceil((t/maxT)*5));\n                const lb=t>=1000?(t/1000).toFixed(1)+'T':Math.round(t)+'B';\n                return `\u003ctd title=\"${lb}\">\u003cspan class=\"heat-cell heat-${lv}\">${lb.replace('B','')}\u003c/span>\u003c/td>`;\n              }).join('')}\n              \u003ctd class=\"model-total\">${fmtT(Math.round(data.apps.reduce((s,v)=>s+v,0)))}\u003c/td>\n            \u003c/tr>`;\n          }).join('')}\n          \u003ctr class=\"totals-row\">\n            \u003ctd class=\"model-name\">App total\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\n            ${appTotals.map(t=>`\u003ctd>${fmtT(Math.round(t))}\u003c/td>`).join('')}\n            \u003ctd class=\"grand\">${fmtT(Math.round(grandTotal))}\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cdiv style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n        ${appNames.map((n,i)=>`\u003cspan style=\"font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--muted)\">${i+1}. ${APPS[i].name}\u003c/span>`).join('')}\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Share by Token Volume\u003c/h2>\n      \u003cp class=\"desc\">Aggregated across all top apps this month.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=allTok?Math.round(t/allTok*100):0;\n          if(pct\u003c1) return '';\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:110px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:18px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction showApp(app,el) {\n  setActive(el);\n  const cd={};\n  (app.models||[]).forEach(m=>{cd[m.creator]=(cd[m.creator]||0)+m.tokens;});\n  const total=(app.models||[]).reduce((s,m)=>s+m.tokens,0)||1;\n  const top=app.models?.[0]||{name:'?',creator:'other'};\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"app-header\">\u003cdiv>\n      \u003cdiv class=\"app-title\">#${app.rank} ${app.name}\u003c/div>\n      \u003cdiv class=\"app-desc\">${app.desc||''}\u003c/div>\n      \u003cdiv class=\"tags\">${(app.tags||[]).map(t=>`\u003cspan class=\"tag\">${t}\u003c/span>`).join('')}\u003c/div>\n      ${app.stale_from?`\u003cdiv class=\"stale\">model mix carried over from ${app.stale_from} \u2014 this app's page returned nothing on the last run\u003c/div>`:''}\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"stats-row\">\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Today\u003c/div>\u003cdiv class=\"s-value\">${app.todayTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">All-Time\u003c/div>\u003cdiv class=\"s-value\">${app.allTimeTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Global Rank\u003c/div>\u003cdiv class=\"s-value rank\">#${app.rank}\u003c/div>\u003c/div>\n      ${app.trend?`\u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Weekly Trend\u003c/div>\u003cdiv class=\"s-value\" style=\"color:${app.trend.startsWith('-')?'#f87171':'#4ade80'}\">${app.trend}\u003c/div>\u003c/div>`:''}\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Top Model\u003c/div>\n        \u003cdiv class=\"s-value\" style=\"font-size:14px;color:${CREATORS[top.creator]||'#fff'}\">${top.name}\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"chart-wrap\">\n      \u003ch2>Top ${(app.models||[]).length} Models This Month\u003c/h2>\n      \u003cp class=\"desc\">Token volume by model. Colors indicate AI lab.\u003c/p>\n      ${(app.models||[]).length===0?'\u003cdiv class=\"no-data\">No model data scraped for this app.\u003c/div>':''}\n      \u003cdiv class=\"bar-list\" id=\"app-chart\">\u003c/div>\n      \u003cdiv class=\"legend\" id=\"creator-legend\">\u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Mix\u003c/h2>\n      \u003cp class=\"desc\">Share of token volume by AI lab.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(cd).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=Math.round(t/total*100);\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:100px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:20px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n\n  const chartEl=document.getElementById('app-chart');\n  if(!chartEl) return;\n  const maxT=Math.max(...(app.models||[]).map(m=>m.tokens))||1;\n  chartEl.innerHTML=(app.models||[]).map(m=>{\n    const pct=Math.round((m.tokens/maxT)*100);\n    const col=CREATORS[m.creator]||'#555';\n    const lbl=fmtT(m.tokens);\n    return `\u003cdiv class=\"bar-row\">\n      \u003cdiv class=\"bar-label\" title=\"${m.name}\">${m.name}\u003c/div>\n      \u003cdiv class=\"bar-track\">\n        \u003cdiv class=\"bar-fill\" style=\"width:${pct}%;background:${col}cc;border:1px solid ${col}44\">\n          ${pct>20?`\u003cspan class=\"bar-fill-label\">${lbl}\u003c/span>`:''}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"bar-value\">${pct\u003c=20?lbl:''}\n        \u003cspan style=\"color:${col};font-size:12.5px;margin-left:4px\">${m.creator}\u003c/span>\u003c/div>\n    \u003c/div>`;\n  }).join('');\n\n  const lgd=document.getElementById('creator-legend');\n  if(lgd) lgd.innerHTML=[...new Set((app.models||[]).map(m=>m.creator))].map(c=>\n    `\u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-dot\" style=\"background:${CREATORS[c]||'#555'}\">\u003c/div>${c}\u003c/div>`\n  ).join('');\n}\n\nrenderSidebar();\nshowOverview(document.querySelector('.overview-item'));\n\u003c/script>\n\u003c/body>\u003c/html>"</script>
<script>
  const parse=id=>JSON.parse(document.getElementById(id).textContent);
  document.getElementById('f-model').srcdoc=parse('d-model');
  document.getElementById('f-apps').srcdoc=parse('d-apps');
  const frames={model:document.getElementById('f-model'),apps:document.getElementById('f-apps')};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    Object.values(frames).forEach(f=>f.classList.remove('on'));
    frames[b.dataset.t].classList.add('on');
  });
</script>
