<!doctype html><html lang="en"><head><meta charset="utf-8">

<style>

<script id="d-model" type="application/json">"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>AI Model Dashboard\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#0e1014; --panel:#161a22; --panel2:#1b2029; --line:#262d39;\n  --ink:#e7edf6; --mut:#94a0b2; --faint:#616b7a;\n  --cn:#f08a63; --oss:#5fb2f2; --closed:#d3dae4;\n  --good:#74c97c; --grid:#1f2530;\n  --res-pos:#f0b429; --res-neg:#6e8bf5;\n  --bar-h:56px; --chart-h:clamp(250px,47vh,420px);\n  --mono:\"SF Mono\",ui-monospace,Menlo,Consolas,monospace;\n  --sans:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Inter,Roboto,sans-serif;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1760px;margin:0 auto;padding:38px 28px 90px}\nh1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}\n.sub{color:var(--mut);font-size:14px;margin-bottom:18px}\n.sub b{color:var(--ink);font-weight:500}\n/* tabs: one section visible at a time; the key lives in the #t= hash so the\n   combined shell (which owns the address bar) and this page agree on it */\n.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}\n.tabbtn{appearance:none;background:transparent;border:1px solid var(--line);color:var(--mut);\n  font-family:var(--sans);font-size:14.5px;font-weight:500;padding:8px 16px;border-radius:9px;cursor:pointer;line-height:1}\n.tabbtn:hover{color:var(--ink);background:rgba(255,255,255,.05)}\n.tabbtn.on{color:#dce8ff;background:#1f2a3b;border-color:#34506f}\n.embedded .tabs,.embedded h1,.embedded .sub{display:none}   /* the combined shell shows its own nav, title and date */\n.embedded .wrap{padding-top:0}\n.tabpanel{display:none}\n.tabpanel.on{display:block}\n.tabpanel>h2:first-child{margin-top:22px}\nh2{font-size:18px;font-weight:600;margin:42px 0 5px;letter-spacing:-.01em}\n.note{color:var(--faint);font-size:14px;margin:0 0 16px;max-width:820px}\n.note a{color:var(--mut)}\n.panel{background:linear-gradient(180deg,#171c25,#13171e);border:1px solid var(--line);border-radius:12px;padding:20px 20px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}\n/* chart (Models tab) */\nsvg{display:block;width:100%;height:auto;overflow:visible}\n.axis{stroke:#39424f;stroke-width:1}\n.gridline{stroke:rgba(255,255,255,.05);stroke-width:1}\n.axislab{fill:var(--mut);font-size:14px;font-family:var(--sans)}\n.tick{fill:var(--faint);font-size:13px;font-family:var(--mono)}\n.chartwrap{position:relative}\n.dot{cursor:pointer}\n.dot:hover{stroke:#fff;stroke-width:1.5}\n.dlabel{fill:#c2ccd9;font-size:13px;font-family:var(--mono);pointer-events:none;paint-order:stroke;stroke:#0e1014;stroke-width:3px}\n.legend{display:flex;gap:18px;align-items:center;font-size:12px;color:var(--mut)}\n.legend i{display:inline-block;margin-right:6px;vertical-align:middle}\n.legend i.dash{width:18px;height:0;border-radius:0;border-top:1.5px dashed rgba(231,237,246,.6)}\n.chartblock{position:sticky;top:var(--bar-h);z-index:11;height:var(--chart-h);display:flex;flex-direction:column;\n  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px 6px}\n#scatter{flex:1;min-height:0}\n#scatter svg{width:100%;height:100%}\n#scatter .tick,#scatter .axislab,#scatter .dlabel{font-size:12px}\n#scatter .tick{font-variant-numeric:tabular-nums}\n#scatter .dlabel{font-family:var(--sans);stroke:var(--panel)}\n.famline{fill:none;stroke-width:2;opacity:.7;stroke-linejoin:round;stroke-linecap:round;pointer-events:none;transition:opacity .12s}\n.frontier{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.55;pointer-events:none;transition:opacity .12s}\n.pt{stroke:var(--panel);stroke-width:2;transition:opacity .12s}\n.pt.hot{stroke:var(--ink)}\n.pt.lead{stroke:#fff;stroke-width:2.5;r:8px}\n.efflabel{fill:var(--mut);font-size:11px;font-family:var(--sans);pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:3px;transition:opacity .12s}\n.famline.hot{stroke-width:2.5}\n#scatter .dlabel{transition:opacity .12s}\n.focus .pt,.focus .famline,.focus .frontier,.focus .dlabel{opacity:.25}\n.labfocus .pt,.labfocus .famline,.labfocus .frontier,.labfocus .dlabel{opacity:.2}\n.labfocus .pt.lab,.labfocus .famline.lab,.labfocus .dlabel.lablabel{opacity:1}\n.focus.labfocus .pt.lab,.focus.labfocus .famline.lab,.focus.labfocus .dlabel.lablabel{opacity:.45}\n.focus .pt.hot,.focus .famline.hot,.focus.labfocus .pt.hot,.focus.labfocus .famline.hot{opacity:1}\n.hotlabel{fill:var(--ink);font-size:12px;font-family:var(--sans);font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}\n.hotlabel .n{font-weight:400;fill:var(--mut);font-family:var(--mono)}\n.gone{display:none}\n.chartnote{color:var(--faint);font-size:12px}\n.chartfoot{display:flex;justify-content:space-between;align-items:center;min-height:20px;padding-top:2px}\n.charthead{display:flex;align-items:center;gap:14px;min-height:26px;margin-bottom:2px}\n.charthead label{color:var(--faint);font-size:12px;white-space:nowrap}\n.charthead select{color-scheme:dark;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:12px var(--sans);padding:3px 6px;margin-left:4px}\n.labs{display:flex;gap:6px;align-items:center;min-width:0;margin-left:auto}\n.labchip{appearance:none;background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--mut);font:12px var(--sans);padding:2px 9px;cursor:pointer;white-space:nowrap}\n.labchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}\n.labchip b{font-weight:400;color:var(--faint);margin-left:3px}\n.labchip:hover{color:var(--ink);border-color:#46607e}\n.labchip.on{background:#23303f;border-color:#36506b;color:#cfe3f7}\n.labmore{color:var(--faint);font-size:12px}\n.chartempty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:14px}\n/* controls */\n.controls{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}\n.ctrlbar{position:sticky;top:0;z-index:12;display:flex;gap:12px;align-items:center;height:var(--bar-h);background:var(--bg)}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}\n.seg button{appearance:none;background:transparent;border:0;border-right:1px solid var(--line);color:var(--mut);\n  font-family:var(--sans);font-size:14px;font-weight:500;padding:7px 14px;cursor:pointer;line-height:1.3}\n.seg button:last-child{border-right:0}\n.seg button:hover{color:var(--ink)}\n.seg button.on{background:#23303f;color:#cfe3f7}\ninput.search{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);\n  padding:7px 12px;font-size:14px;width:230px;font-family:var(--sans)}\ninput.search::placeholder{color:var(--faint)}\n.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:20px;\n  padding:6px 15px;font-size:14px;cursor:pointer;user-select:none;font-family:var(--sans);line-height:1.3}\n.chip:hover{color:var(--ink)}\n.chip.on{background:#23303f;border-color:#36506b;color:#cfe3f7}\nbutton:focus-visible,input:focus-visible{outline:2px solid #7c9cf2;outline-offset:2px}\n.cnt{color:var(--faint);font-size:14px;margin-left:auto;font-family:var(--mono)}\n/* table */\ntable.grid{width:100%;border-collapse:collapse;font-size:14px}\ntable.grid th,table.grid td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\ntable.grid th{position:sticky;top:0;z-index:10;background:var(--bg);color:var(--mut);font-weight:500;\n  text-align:right;cursor:pointer;user-select:none;font-size:14px}\ntable.grid th.l,table.grid td.l{text-align:left}\ntable.grid th:hover{color:var(--ink)}\ntable.grid td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}\n#t1{margin-top:8px}\n#t1 th,#t1 td{padding-left:6px;padding-right:6px}\n#t1 th{top:calc(var(--bar-h) + var(--chart-h))}\n#t1 tbody tr{scroll-margin-top:calc(var(--bar-h) + var(--chart-h) + 84px)}\ntable.grid td.l{font-family:var(--sans)}\ntable.grid tbody tr:hover td{background:#1c222c}\ntable.grid tbody tr.hl td{background:#1d2530}\ntable.grid tbody tr.hl2 td{background:#2a3647}\ntable.grid tbody tr.hl2 td:first-child{box-shadow:inset 2px 0 0 var(--ink)}\n.modelcell{font-weight:500;display:inline-block;max-width:280px;overflow:hidden;text-overflow:ellipsis;\n  white-space:nowrap;vertical-align:middle}\n.modelcell a.mlink{color:inherit;text-decoration:none}\n.modelcell a.mlink:hover{text-decoration:underline;text-decoration-color:var(--faint)}\n.modelcell.nomatch{color:var(--faint);font-weight:400}\n/* family rows (Frontier): fixed-width expander slot on every row so names stay\n   aligned whether or not a row has one; sub-rows dim and indent the name only */\n.exp{display:inline-block;width:16px;margin-right:2px;text-align:center;color:var(--faint);font-size:12px;\n  vertical-align:middle;user-select:none}\n.exp[data-fam]{cursor:pointer}\n.exp[data-fam]:hover{color:var(--ink)}\n.nset{color:var(--faint);font-size:12px;font-family:var(--sans);font-weight:400;margin-left:7px;vertical-align:middle}\ntr.sub td{background:rgba(0,0,0,.22)}\ntr.sub .modelcell{margin-left:22px;font-weight:400;color:var(--mut)}\n/* a family-row value borrowed from a lower effort setting (see fillHead) */\n.borrowed{color:var(--faint);font-style:italic}\n/* Best for\u2026 section: winners strip + per-job grid */\n.bfstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 22px;\n  margin:0 0 16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:9px}\n.bf-item{display:flex;flex-direction:column;gap:3px;font-size:14px;min-width:0}\n.bf-job{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}\n.bf-job .bf-n{text-transform:none;letter-spacing:0;color:var(--faint);margin-left:6px}\n.bf-winner{color:var(--ink);font-weight:600;line-height:1.35}\n.bf-nm{white-space:nowrap}\n#tbf td:first-child{width:220px}\n#tbf .modelcell{max-width:200px}\n.linkrow{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}\n.mlink-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--sans);font-weight:600;\n  padding:1.5px 6px;border-radius:9px;text-decoration:none;border:1px solid transparent;\n  letter-spacing:.02em;transition:all .1s;opacity:.85}\n.mlink-chip:hover{opacity:1;transform:translateY(-1px)}\n.mlink-chip.or{background:rgba(95,178,242,.12);color:var(--oss);border-color:rgba(95,178,242,.3)}\n.mlink-chip.or:hover{background:rgba(95,178,242,.22)}\n.mlink-chip svg{width:9px;height:9px}\n.tag{font-size:12px;font-family:var(--mono);padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:middle}\n.tag.cn{background:rgba(240,138,99,.18);color:var(--cn)}\n.tag.os{background:rgba(95,178,242,.18);color:var(--oss)}\n.crt{color:var(--mut);font-size:13.5px}\n.bar{position:relative}\n.bar span{position:absolute;left:0;top:0;bottom:0;background:rgba(139,164,204,.18);border-radius:2px;z-index:0}\n.bar em{position:relative;z-index:1;font-style:normal}\n.up{color:var(--faint)}\n.arrow{color:var(--ink)}\n.tie1{color:var(--good);font-weight:600}\n.warnnote{color:var(--cn);font-size:13.5px;margin:0 0 12px}\n/* Benchmarks vs people scatter */\n.bvp-flex{display:flex;gap:22px;align-items:flex-start}\n.bvp-chart{flex:1;min-width:0}\n.bvp-gaps{width:230px;flex-shrink:0}\n.bvp-gaptitle{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}\n.bvp-gaprow{display:flex;justify-content:space-between;gap:10px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:14px}\n.bvp-gaprow:hover{background:#1c222c}\n.bvp-gapval{font-family:var(--mono);font-weight:600}\n.bvp-gapval.pos{color:var(--res-pos)}\n.bvp-gapval.neg{color:var(--res-neg)}\n.whisker{stroke:var(--mut);stroke-width:1.3;opacity:.6}\n.trend{stroke:var(--mut);stroke-width:1.4;stroke-dasharray:6 5;opacity:.55}\n.capnote{fill:var(--faint);font-size:12.5px;font-family:var(--sans)}\n@media(max-width:860px){.bvp-flex{flex-direction:column}.bvp-gaps{width:100%}}\n/* model card */\n.modelcell{cursor:pointer}\n.mcard{position:fixed;z-index:60;width:360px;max-width:calc(100vw - 16px);background:rgba(10,12,16,.97);\n  backdrop-filter:blur(4px);border:1px solid #313a48;border-radius:10px;padding:12px 14px;font-size:13.5px;\n  line-height:1.45;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .08s;left:0;top:0}\n.mcard.on{opacity:1;visibility:visible}\n.mcard.pinned{border-color:#46607e;box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 0 1px rgba(124,156,242,.15)}\n.mc-h b{font-size:15px;font-weight:600}\n.mc-sub,.mc-facts{color:var(--mut);font-size:12.5px;margin-top:1px}\n.mc-facts{margin-top:6px}\n.mc-sec{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:11px 0 3px}\n.mc-t{width:100%;border-collapse:collapse}\n.mc-t td{padding:2px 0 2px 12px;font-family:var(--mono);text-align:right;white-space:nowrap}\n.mc-t td.l{text-align:left;font-family:var(--sans);padding-left:0;color:var(--mut)}\n.mc-t td.w{font-family:var(--sans);color:var(--mut);font-size:12.5px}\n.mc-t tr.hd td{color:var(--faint);font-family:var(--sans);font-size:11.5px}\n.mc-t tr.cur td{color:#fff;font-weight:600}\n.mc-t tr.cur td.l::before{content:'\u25b8 ';color:var(--mut)}\n.mc-muted{color:var(--faint);font-size:12.5px;margin-top:3px}\n.mc-links{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}\n.mlink-chip.ar,.mlink-chip.aa{background:rgba(148,160,178,.12);color:var(--mut);border-color:rgba(148,160,178,.3)}\nfooter{margin-top:48px;color:var(--faint);font-size:14px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}\nfooter a{colo ck=()=>selectTab(b.dataset.tab));\nfunction openFromHash(){\n  const p=hashParts(HWIN.location.hash);\n  showTab(p.t||TAB_DEFAULT);\n  if(!p.m) return;\n  const slug=decodeURIComponent(p.m), d=BYSLUG[slug]; if(!d) return;\n  const q=`tr[data-key=\"${CSS.escape(slug.replace(/\"/g,''))}\"] .modelcell`;\n  // A model the cutoff, chips or search hide would have no row to anchor to: show all.\n  if(!st1.filter(d)||(st1.q&&!(d.name+' '+(d.creator||'')).toLowerCase().includes(st1.q.toLowerCase()))){\n    st1.min=0; st1.china=st1.open=false; st1.q=''; syncControls();}\n  if(st1.reveal) st1.reveal(slug);\n  const cell=document.querySelector('#t1 '+q);\n  if(!cell) return;\n  // The card anchors to a table row, so bring that row's tab forward first.\n  const owner=cell.closest('.tabpanel'); if(owner&&owner.dataset.panel!==curTab) selectTab(owner.dataset.panel);\n  cell.closest('tr').scrollIntoView({block:'start'}); pinned=false; pinCard(d,cell); }\n\n// Rows collapse into families (same lab + base name): the\n// family row carries its strongest variant (highest intel) in every column, and\n// the other effort settings hang under it as sub-rows, in ladder order, when the\n// family is expanded. Sorting, search and filters act on the family through its\n// members; expanded families survive re-render.\n// Family head = strongest variant (highest intel). AA scores the strongest\n// setting last, so a family row can be blank where a lower setting already\n// has a number. fillHead fills each blank column from the first sub-row\n// (ladder order) that has it. disp = head with the borrowed values, used for\n// display and sorting; bor = column key -> source effort label. Intel and the\n// name are the family's own by construction and never borrowed. Shared by\n// makeTable's family grouping and the Best-for grid's famGroups below.\nconst headOf=ms=>ms.reduce((a,b)=>(b.intel||0)>(a.intel||0)?b:a);\nfunction fillHead(head,subs,cols){\n  const disp={...head}, bor={};\n  if(!subs.length) return {disp,bor};\n  cols.forEach(c=>{const k=c.k; if(k==='name'||k==='intel'||head[k]!=null) return;\n    const src=subs.find(s=>s[k]!=null); if(!src) return;\n    disp[k]=src[k]; bor[k]=effortOf(src.name);\n    // Arena columns render from d.arena.\u003cboard>, not from the sort key.\n    if(k.startsWith('ar_')){const b=k.slice(3); disp.arena={...(head.arena||{}),[b]:(src.arena||{})[b]};}});\n  return {disp,bor};}\n// One row per family (famKey), head-filled from its sub-rows. Used by the\n// Best-for grid, which \u2014 unlike makeTable \u2014 always shows every family with\n// no search/filter/expand state.\nfunction famGroups(rows,cols){\n  const groups=new Map();\n  rows.forEach(d=>{const k=famKey(d); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(d);});\n  const fams=[];\n  groups.forEach((ms,k)=>{\n    const head=headOf(ms);\n    const subs=ms.filter(d=>d!==head).sort((a,b)=>effortRank(a)-effortRank(b)||(b.intel||0)-(a.intel||0));\n    const {disp,bor}=fillHead(head,subs,cols);\n    fams.push({k,head,disp,bor,subs});});\n  return fams;\n}\n\nfunction makeTable(elId,rows,state){\n  const el=document.getElementById(elId);\n  const mx={intel:maxOf(rows,'intel')};\n  const expanded=new Set();\n  const groups=new Map();\n  rows.forEach(d=>{const k=famKey(d); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(d);});\n  function nameCell(e){\n    if(e.sub) return `\u003cspan class=\"exp\">\u003c/span>${modelCell(e.d,effortOf(e.d.name))}`;\n    const n=1+e.fam.subs.length, eff=effortOf(e.d.name);   // the setting this family row reports, e.g. \"Max\"\n    if(n===1) return `\u003cspan class=\"exp\">\u003c/span>${modelCell(e.d)}`;\n    return `\u003cspan class=\"exp\" data-fam=\"${escA(e.fam.k)}\" title=\"${e.fam.open?'Hide':'Show'} effort settings\">${e.fam.open?'\u25be':'\u25b8'}\u003c/span>`+\n      modelCell(e.d,baseName(e.d.name),`\u003cspan class=\"nset\">${escA(eff==='\u2014'?'Default':eff[0].toUpperCase()+eff.slice(1))} \u00b7 ${n} settings\u003c/span>`);}\n  function render(){\n    const q=state.q.toLowerCase();\n    const ok=d=>state.filter(d)&&(!q||(d.name+' '+(d.creator||'')).toLowerCase().includes(q));\n    const fams=[];\n    groups.forEach((ms,k)=>{const vis=ms.filter(ok); if(!vis.length) return;\n      const head=headOf(vis);\n      const subs=vis.filter(d=>d!==head).sort((a,b)=>effortRank(a)-effortRank(b)||(b.intel||0)-(a.intel||0));\n      const {disp,bor}=fillHead(head,subs,state.cols);\n      // First-token range across the listed settings, e.g. \"8.7\u2013731 s\"; none when they do not differ.\n      const tt=vis.map(d=>d.ttft).filter(x=>x!=null), tf=x=>fmt(x,x\u003c10?1:0);\n      disp.ttft_rng=tt.length>1&&tf(Math.min(...tt))!==tf(Math.max(...tt))?`${tf(Math.min(...tt))}\u2013${tf(Math.max(...tt))} s`:null;\n      fams.push({k,head,disp,bor,subs,open:expanded.has(k)});});\n    // Sort on the displayed value so a family never sinks for a number it shows.\n    if(state.sort){const {k,dir}=state.sort;\n      fams.sort((a,b)=>{let x=a.disp[k],y=b.disp[k];\n        if(typeof x==='string'||typeof y==='string'){x=(x||'');y=(y||'');return dir*((x>y)-(x\u003cy));}\n        x=(x==null?-Infinity:x);y=(y==null?-Infinity:y);return dir*(x-y);});}\n    const view=[];\n    fams.forEach(f=>{view.push({d:f.head,disp:f.disp,bor:f.bor,fam:f}); if(f.open) f.subs.forEach(d=>view.push({d,sub:true}));});\n    // A column nobody in view has a value for is dropped (Params under the top cutoff).\n    const listed=fams.flatMap(f=>[f.head,...f.subs]);\n    const cols=state.cols.filter(c=>c.k==='name'||listed.some(d=>d[c.k]!=null));\n    let h='\u003cthead>\u003ctr>'+cols.map(c=>{const ar=state.sort&&state.sort.k===c.k?(state.sort.dir>0?' \u2191':' \u2193'):'';\n      return `\u003cth class=\"${c.l?'l':''}\" data-k=\"${c.k}\">${c.t}\u003cspan class=\"arrow\">${ar}\u003c/span>\u003c/th>`;}).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n    h+=view.map(e=>{const d=e.d, v=e.disp||d, bor=e.bor||{};\n      return `\u003ctr class=\"${e.sub?'sub':''}\" data-key=\"${(d.slug||'').replace(/\"/g,'')}\">`+cols.map(c=>{let inner=c.k==='name'?nameCell(e):c.r(v);\n        if(bor[c.k]) inner=`\u003cspan class=\"borrowed\" title=\"${escA(`from the ${bor[c.k]} setting \u2014 AA hasn't scored ${effortOf(d.name).replace('\u2014','this setting')} on this yet`)}\">${inner}\u003c/span>`;\n        if(c.bar){const w=Math.max(0,((v[c.bar]||0)/mx[c.bar])*100);\n          inner=`\u003cspan class=\"bar\">\u003cspan style=\"width:${w}%\">\u003c/span>\u003cem>${inner}\u003c/em>\u003c/span>`;}\n        return `\u003ctd class=\"${c.l?'l':''}\">${inner}\u003c/td>`;}).join('')+'\u003c/tr>';}).join('');\n    h+='\u003c/tbody>';\n    el.innerHTML=h;\n    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;\n      state.sort=(state.sort&&state.sort.k===k)?{k,dir:-state.sort.dir}:{k,dir:-1};render();});\n    el.querySelectorAll('.exp[data-fam]').forEach(x=>x.onclick=()=>{const k=x.dataset.fam;\n      if(expanded.has(k)) expanded.delete(k); else expanded.add(k); render();});\n    el.querySelectorAll('tbody tr').forEach((tr,i)=>{\n      const d=view[i].d, cell=tr.querySelector('.modelcell');\n      if(cell){ cell.dataset.card='1';\n        cell.onmouseenter=()=>showCard(d,cell);\n        cell.onmouseleave=hideCardSoon;\n        cell.onclick=e=>{e.stopPropagation(); togglePin(d,cell);}; }\n      tr.onmouseenter=()=>CHART.fromRow(tr.dataset.key);\n      tr.onmouseleave=CHART.clear;});\n    CHART.draw(listed);\n    if(state.cnt){const n=fams.length, t=fams.reduce((s,f)=>s+1+f.subs.length,0);\n      document.getElementById(state.cnt).textContent=`${n} models \u00b7 ${t} settings`;}\n  }\n  // Expand the family whose non-strongest member has this slug (used by #m=\u003cslug>).\n  state.reveal=slug=>{\n    groups.forEach((ms,k)=>{ if(ms.length>1&&!expanded.has(k)&&ms.some(d=>d.slug===slug)&&headOf(ms).slug!==slug){expanded.add(k); render();}});};\n  state.render=render; render();\n}\n\n/* ---------- cost chart: cost per task x intelligence ----------\n   Draws the settings the Models table lists (the table calls CHART.draw on every\n   render): one dot per setting that has a cost per task, one line per family\n   joining its settings cheapest to dearest, dashed efficient frontier. Hover is\n   focus plus context: what you point at stays at full strength, the rest dims. */\nfunction niceStep(range,target){\n  const raw=range/target||1;\n  const mag=Math.pow(10,Math.floor(Math.log10(raw)));\n  const norm=raw/mag;\n  return (norm\u003c1.5?1:norm\u003c3?2:norm\u003c7?5:10)*mag;\n}\nconst usd=c=>'$'+(c\u003c0.1?c.toFixed(3):c\u003c10?c.toFixed(2):c.toFixed(1));\n// Chart axes. hi:1 means more is better on x (speed); otherwise less is better (price, time),\n// and the efficient frontier runs from the low end. On y more is always better.\nconst AXES_X={\n  cost: {k:'cost_task',t:'$ / task',       pre:'$',f:usd,hi:0,title:'Cost per task, log scale \u00b7 pricier \u2192'},\n  blend:{k:'blended',  t:'$ / 1M tokens',  pre:'$',f:usd,hi:0,title:'Price per 1M tokens (blended), log scale \u00b7 pricier \u2192'},\n  speed:{k:'tput',     t:'Speed tok/s',    pre:'', f:v=>Math.round(v)+' tok/s',hi:1,title:'Speed, tokens per second, log scale \u00b7 faster \u2192'},\n  ttft: {k:'ttft',     t:'First token s',  pre:'', f:v=>(v\u003c10?v.toFixed(1):Math.round(v))+' s',hi:0,title:'First token, seconds, log scale \u00b7 slower \u2192'}};\nconst AXES_Y={\n  intel: {k:'intel',    t:'Intelligence',f:v=>fmt(v,1)},\n  arena: {k:'ar_text',  t:'Arena text',  f:v=>fmt(v,0)},\n  webdev:{k:'ar_webdev',t:'WebDev',      f:v=>fmt(v,0)},\n  code:  {k:'coding',   t:'AA Code',     f:v=>fmt(v,1)}};\n// One fixed colour per lab for the 8 labs with the most settings in the whole dataset (so a lab keeps\n// its colour as filters change); every other lab is one muted neutral. Categorical dark-surface\n// palette from the dataviz skill, slots in order; largest lab takes slot 1.\nconst LABPAL=['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'], LABOTHER='#8791a1';\nconst LABCOL=new Map((()=>{const n={}; DATA.forEach(d=>{ if(d.creator) n[d.creator]=(n[d.creator]||0)+1; });\n  return Object.entries(n).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,LABPAL.length).map(([c],i)=>[c,LABPAL[i]]); })());\nconst CHART=(function(){\n  const host=document.getElementById('scatter'), note=document.getElementById('scatternote'), labsEl=document.getElementById('labs');\n  const NS='http://www.w3.org/2000/svg', m={l:42,r:14,t:12,b:40};\n  const col=p=>LABCOL.get(p.creator)||LABOTHER;\n  const inter=(a,b)=>Math.max(0,Math.min(a.x2,b.x2)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y2,b.y2)-Math.max(a.y,b.y));\n  const rowOf=slug=>document.querySelector(`#t1 tr[data-key=\"${CSS.escape(slug)}\"]`);\n  const sq=(x,y,r)=>({x:x-r,y:y-r,x2:x+r,y2:y+r});\n  let view=null, heads=new Map(), drawn='', S=null;\n  // The view: axes and the pinned lab live in the URL hash (x=, y=, l=) so a refresh keeps them.\n  const hp=hashParts(HWIN.location.hash);\n  const ax={x:AXES_X[hp.x]?hp.x:'cost', y:AXES_Y[hp.y]?hp.y:'intel'};\n  let labPin=hp.l?decodeURIComponent(hp.l):'', labPrev='';\n  function persist(){ const p=hashParts(HWIN.location.hash);\n    p.x=ax.x==='cost'?'':ax.x; p.y=ax.y==='intel'?'':ax.y; p.l=labPin?encodeURIComponent(labPin):''; writeHash(p); }\n  [['ax-x',AXES_X,'x'],['ax-y',AXES_Y,'y']].forEach(([id,defs,k])=>{\n    const sel=document.getElementById(id);\n    sel.innerHTML=Object.entries(defs).map(([key,a])=>`\u003coption value=\"${key}\">${escA(a.t)}\u003c/option>`).join('');\n    sel.value=ax[k];\n    sel.onchange=()=>{ ax[k]=sel.value; persist(); drawn=''; paint(); };});\n\n  function draw(rows){\n    view=rows; heads=new Map();\n    const g=new Map(); rows.forEach(d=>{const k=famKey(d); if(!g.has(k)) g.set(k,[]); g.get(k).push(d);});\n    g.forEach((ms,k)=>heads.set(k,headOf(ms).slug));\n    paint();\n  }\n  function paint(){\n    const W=host.clientWidth, H=host.clientHeight;\n    if(!view||!W||!H) return;                  // hidden tab: the ResizeObserver paints it when shown\n    const id=W+'x'+H+ax.x+ax.y+'|'+view.map(d=>d.slug).join(',');\n    if(id===drawn){ clear(); return; }\n    drawn=id; S=null; clear();\n    const AX=AXES_X[ax.x], AY=AXES_Y[ax.y], xk=AX.k, yk=AY.k;\n    const pts=view.filter(d=>d[xk]>0&&d[yk]!=null), miss=view.length-pts.length;\n    note.textContent=miss?`${miss} of ${view.length} settings in this view ${miss===1?'has':'have'} no ${ax.x==='cost'&&ax.y==='intel'?'cost data':'data for these axes'}`:'';\n    if(!pts.length){ host.innerHTML='\u003cdiv class=\"chartempty\">No data for these axes in this view\u003c/div>'; labsEl.innerHTML=''; return; }\n\n    // axes: x is log, y is fitted to the plotted settings with a little padding\n    const xs=pts.map(p=>p[xk]), ys=pts.map(p=>p[yk]);\n    const xmin=Math.min(...xs)/1.35, xmax=Math.max(...xs)*1.35;\n    const yr=(Math.max(...ys)-Math.min(...ys))||10;\n    const ymin=Math.min(...ys)-yr*.08, ymax=Math.max(...ys)+yr*.08;\n    const X=v=>m.l+Math.log(v/xmin)/Math.log(xmax/xmin)*(W-m.l-m.r);\n    const Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);\n    const ystep=niceStep(ymax-ymin,6), mult=Math.log10(xmax/xmin)\u003c1.6?[1,2,5]:[1,3];\n    let s=`\u003csvg viewBox=\"0 0 ${W} ${H}\" width=\"${W}\" height=\"${H}\">`;\n    for(let v=Math.ceil(ymin/ystep)*ystep; v\u003c=ymax; v+=ystep){ const y=Y(v).toFixed(1);\n      s+=`\u003cline class=\"gridline\" x1=\"${m.l}\" y1=\"${y}\" x2=\"${W-m.r}\" y2=\"${y}\"/>\u003ctext class=\"tick\" x=\"${m.l-8}\" y=\"${(+y+4).toFixed(1)}\" text-anchor=\"end\">${Math.round(v)}\u003c/text>`;}\n    for(let e=Math.floor(Math.log10(xmin)); e\u003c=Math.ceil(Math.log10(xmax)); e++) mult.forEach(k=>{\n      const v=+(k*10**e).toPrecision(2); if(v\u003cxmin||v>xmax) return; const x=X(v).toFixed(1);\n      s+=`\u003cline class=\"gridline\" x1=\"${x}\" y1=\"${m.t}\" x2=\"${x}\" y2=\"${H-m.b}\"/>\u003ctext class=\"tick\" x=\"${x}\" y=\"${H-m.b+16}\" text-anchor=\"middle\">${AX.pre}${v}\u003c/text>`;});\n    s+=`\u003cline class=\"axis\" x1=\"${m.l}\" y1=\"${H-m.b}\" x2=\"${W-m.r}\" y2=\"${H-m.b}\"/>\u003cline class=\"axis\" x1=\"${m.l}\" y1=\"${m.t}\" x2=\"${m.l}\" y2=\"${H-m.b}\"/>`;\n    s+=`\u003ctext class=\"axislab\" x=\"${W-m.r}\" y=\"${H-3}\" text-anchor=\"end\">${AX.title}\u003c/text>`;\n\n    // efficient frontier: best x first, keep only rising y\n    const sorted=[...pts].sort((a,b)=>(AX.hi?b[xk]-a[xk]:a[xk]-b[xk])||b[yk]-a[yk]);\n    let best=-Infinity; const fr=sorted.filter(p=>p[yk]>best&&(best=p[yk],true)), onfr=new Set(fr);\n    const fams=new Map(); sorted.forEach(p=>{const k=famKey(p); if(!fams.has(k)) fams.set(k,[]); fams.get(k).push(p);});\n    const xy=p=>X(p[xk]).toFixed(1)+','+Y(p[yk]).toFixed(1);\n    fams.forEach((ms,k)=>{ if(ms.length>1) s+=`\u003cpolyline class=\"famline\" data-fam=\"${escA(k)}\" stroke=\"${col(ms[0])}\" points=\"${ms.map(xy).join(' ')}\"/>`;});\n    s+=`\u003cpolyline class=\"frontier\" points=\"${fr.map(xy).join(' ')}\"/>\u003cg id=\"dots\">`;\n    pts.forEach(p=>{ s+=`\u003ccircle class=\"pt\" data-slug=\"${escA(p.slug)}\" cx=\"${X(p[xk]).toFixed(1)}\" cy=\"${Y(p[yk]).toFixed(1)}\" r=\"${onfr.has(p)?6:5}\" fill=\"${col(p)}\" fill-opacity=\"${onfr.has(p)?1:.85}\"/>`;});\n    s+=`\u003c/g>\u003cg id=\"dlabels\">\u003c/g>\u003ctext class=\"hotlabel gone\" x=\"0\" y=\"0\">\u003c/text>\u003c/svg>`;\n    host.innerHTML=s;\n\n    const svg=host.firstChild, els=svg.querySelectorAll('.pt');\n    const Q=pts.map((p,i)=>({p,x:X(p[xk]),y:Y(p[yk]),el:els[i]}));\n    S={svg,Q,AX,AY,xk,yk,dots:svg.querySelector('#dots'),labg:svg.querySelector('#dlabels'),hot:svg.querySelector('.hotlabel'),\n       labels:[],labLabels:[],over:null,bySlug:new Map(Q.map(q=>[q.p.slug,q])),byFam:new Map(),\n       lines:new Map([...svg.querySelectorAll('.famline')].map(l=>[l.dataset.fam,l]))};\n    Q.forEach(q=>{const k=famKey(q.p); if(!S.byFam.has(k)) S.byFam.set(k,[]); S.byFam.get(k).push(q);});\n\n    // One label per family on the frontier, at its highest-scoring frontier setting.\n    // Each takes the first spot that overlaps no dot or placed label and stays in the plot.\n    const tops=new Map(); fr.forEach(p=>{const k=famKey(p); if(!tops.has(k)||p[yk]>tops.get(k)[yk]) tops.set(k,p);});\n    const dotBoxes=Q.map(q=>sq(q.x,q.y,8));\n    [...tops.values()].forEach(p=>{\n      const t=document.createElementNS(NS,'text'); t.setAttribute('class','dlabel'); t.textContent=shortName(p.name); S.labg.appendChild(t);\n      const q=S.bySlug.get(p.slug), box=put(t,q.x,q.y,null,dotBoxes,true);\n      if(box) S.labels.push({slug:p.slug,el:t,box}); else t.remove();});\n\n    // lab buttons: the labs among the plotted settings, biggest first\n    const cnt=new Map(); Q.forEach(q=>{const c=q.p.creator; if(c) cnt.set(c,(cnt.get(c)||0)+1);});\n    const labs=[...cnt].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])), rest=labs.slice(10);\n    labsEl.innerHTML=labs.slice(0,10).map(([c,n])=>`\u003cbutton class=\"labchip\" data-lab=\"${escA(c)}\">\u003ci style=\"background:${LABCOL.get(c)||LABOTHER}\">\u003c/i>${escA(c)} \u003cb>${n}\u003c/b>\u003c/button>`).join('')+\n      (rest.length?`\u003cspan class=\"labmore\" title=\"${escA(rest.map(([c,n])=>c+' '+n).join(', '))}\">+${rest.length}\u003c/span>`:'');\n    labsEl.querySelectorAll('.labchip').forEach(b=>{\n      b.onmouseenter=()=>{ labPrev=b.dataset.lab; applyLab(); };\n      b.onmouseleave=()=>{ labPrev=''; applyLab(); };\n      b.onclick=()=>{ labPin=labPin===b.dataset.lab?'':b.dataset.lab; persist(); applyLab(); };});\n\n    svg.onmousemove=e=>{ const q=nearest(e); svg.style.cursor=q?'pointer':'';\n      if(q===S.over) return; S.over=q; if(q) fromDot(q); else clear(); };\n    svg.onmouseleave=()=>{ S.over=null; clear(); };\n    svg.onclick=e=>{ const q=nearest(e); if(q){ e.stopPropagation(); pick(q.p); } };\n    applyLab();\n  }\n  // Light up one lab (the hovered button, else the pinned one): its dots and lines at full\n  // strength, everything else dimmed, and one name per line at its highest setting.\n  function applyLab(){\n    const cur=labPrev||labPin;\n    labsEl.querySelectorAll('.labchip').forEach(b=>b.classList.toggle('on',b.dataset.lab===labPin));\n    if(!S) return;\n    S.labLabels.forEach(l=>{ if(l.own){ l.el.remove(); S.labels=S.labels.filter(x=>x.el!==l.el); } else l.el.classList.remove('lablabel'); });\n    S.labLabels=[];\n    const mine=S.Q.filter(q=>q.p.creator===cur&&cur);\n    S.svg.classList.toggle('labfocus',!!mine.length);\n    S.Q.forEach(q=>q.el.classList.toggle('lab',mine.includes(q)));\n    S.lines.forEach((l,k)=>l.classList.toggle('lab',!!mine.length&&S.byFam.get(k)[0].p.creator===cur));\n    if(!mine.length) return;\n    const own=mine.map(q=>sq(q.x,q.y,8)), byFam=new Map();\n    mine.forEach(q=>{const k=famKey(q.p); if(!byFam.has(k)||q.p[S.yk]>byFam.get(k).p[S.yk]) byFam.set(k,q);});\n    byFam.forEach(q=>{\n      const old=S.labels.find(l=>l.slug===q.p.slug);\n      if(old){ old.el.classList.add('lablabel'); S.labLabels.push({el:old.el,own:false}); return; }\n      const t=document.createElementNS(NS,'text'); t.setAttribute('class','dlabel lablabel'); t.textContent=baseName(q.p.name); S.labg.appendChild(t);\n      S.labels.push({slug:q.p.slug,el:t,box:put(t,q.x,q.y,null,own)}); S.labLabels.push({el:t,own:true});});\n  }\n  addEventListener('keydown',e=>{ if(e.key==='Escape'&&labPin){ labPin=''; persist(); applyLab(); } });\n  // Put text t beside the dot at (cx,cy): the nearest of 8 directions x 4 distances that\n  // overlaps no box in obst and no placed label (except the one for slug skip), else the least-bad;\n  // strict: else none (null), so a crowded frontier drops a name rather than print over another.\n  function put(t,cx,cy,skip,obst,strict){\n    t.setAttribute('x',0); t.setAttribute('y',0);\n    const bb=t.getBBox(), w=bb.width+4, h=bb.height, W=S.svg.viewBox.baseVal.width, H=S.svg.viewBox.baseVal.height;\n    let best=null, bc=Infinity;\n    for(const g of [9,22,40,64,90]){\n      const c=[[cx+g,cy-h/2],[cx-g-w,cy-h/2],[cx-w/2,cy-g-h],[cx-w/2,cy+g],[cx+g,cy-g-h],[cx+g,cy+g],[cx-g-w,cy-g-h],[cx-g-w,cy+g]];\n      for(const [x,y] of c){ const b={x,y,x2:x+w,y2:y+h};\n        let cost=g+((x\u003cm.l||x+w>W-m.r||y\u003cm.t-8||y+h>H-m.b)?1e6:0), lo=0;\n        obst.forEach(o=>{ cost+=inter(b,o)*10; });\n        S.labels.forEach(l=>{ if(l.slug!==skip) lo+=inter(b,l.box); });\n        if(strict&&lo) continue;\n        cost+=lo*20;\n        if(cost\u003cbc){ bc=cost; best=b; } }\n      if(bc\u003c=g) break;\n    }\n    if(!best) return null;\n    t.setAttribute('x',(best.x+2-bb.x).toFixed(1)); t.setAttribute('y',(best.y-bb.y).toFixed(1));\n    return best;\n  }\n  const nearest=e=>{ const r=S.svg.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;\n    let q0=null, d0=16*16; S.Q.forEach(q=>{const d=(q.x-x)**2+(q.y-y)**2; if(d\u003cd0){d0=d; q0=q;}}); return q0; };\n\n  // Focus on one model's whole effort curve: every setting's dot and its line at full strength, the\n  // rest dimmed. Each lit dot names its effort level; the lead dot (the setting pointed at) gets the\n  // ring and its full name with numbers. The table lights the family's rows and, harder, the lead's\n  // (the family row while the setting is collapsed under it). Nothing expands or scrolls on hover.\n  function focus(p,rowSlug){\n    clear(); if(!S) return;\n    const fam=famKey(p), ps=S.byFam.get(fam)||[]; if(!ps.length) return;\n    const lead=S.bySlug.get(p.slug)||ps.reduce((a,b)=>b.p[S.yk]>a.p[S.yk]?b:a);\n    S.svg.classList.add('focus');\n    ps.forEach(q=>{ q.el.classList.add('hot'); S.dots.appendChild(q.el); });\n    lead.el.classList.add('lead');\n    if(S.lines.has(fam)) S.lines.get(fam).classList.add('hot');\n    S.labels.forEach(l=>{ if(ps.some(q=>q.p.slug===l.slug)) l.el.classList.add('gone'); });\n    const t=S.hot; t.textContent=shortName(lead.p.name);\n    const n=document.crea  const tr=rowOf(p.slug)||rowOf(heads.get(famKey(p))); if(!tr) return;\n    tr.scrollIntoView({block:'start'});\n    togglePin(p,tr.querySelector('.modelcell'));\n  }\n  new ResizeObserver(paint).observe(host);\n  return {draw,fromRow,clear};\n})();\n\n// Every row with an intel score. The cutoff, the two chips and the search are the\n// only things that narrow it; the chart draws exactly what the table lists.\nconst ALL=DATA.filter(d=>d.intel!=null).sort((a,b)=>b.intel-a.intel);\nconst st1={sort:{k:'intel',dir:-1},q:'',cnt:'c1',cols:COLS,min:IMIN,china:false,open:false};\nst1.filter=d=>d.intel>=st1.min&&(!st1.china||d.china)&&(!st1.open||d.open);\nmakeTable('t1',ALL,st1);\nconst search=document.getElementById('s1');\nfunction syncControls(){\n  document.querySelectorAll('#cutoff button').forEach(c=>c.classList.toggle('on',Number(c.dataset.min)===st1.min));\n  document.querySelectorAll('[data-f]').forEach(c=>{const on=!!st1[c.dataset.f]; c.classList.toggle('on',on); c.setAttribute('aria-pressed',on);});\n  search.value=st1.q; st1.render();}\nsearch.oninput=e=>{st1.q=e.target.value;st1.render();};\ndocument.querySelectorAll('#cutoff button').forEach(c=>c.onclick=()=>{st1.min=Number(c.dataset.min);syncControls();});\ndocument.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{st1[c.dataset.f]=!st1[c.dataset.f];syncControls();});\nsyncControls();\n\n/* ---------- Best for\u2026 : one row per Frontier family, one column per job ---------- */\n(function(){\n  const cols=[{k:'name',t:'Model',l:1},\n    ...BOARDS.filter(([b])=>b!=='search').map(([b,l])=>({k:'ar_'+b,t:l})),\n    {k:'coding',t:'AA Code'},{k:'agent',t:'AA Agent'}];\n  const fams=famGroups(OVERALL,cols);\n  const rawVal=(f,k)=>{ if(k.startsWith('ar_')){const a=(f.disp.arena||{})[k.slice(3)]; return a?a.r:null;}\n    return f.disp[k]; };\n  // Single-hue sequential shade (desaturated blue; green is kept for ties for\n  // first), ranked within the column among the rows shown (ties share a shade);\n  // the number itself still carries the value.\n  const SHADES=['rgba(139,164,204,.40)','rgba(139,164,204,.29)','rgba(139,164,204,.19)',\n                'rgba(139,164,204,.11)','rgba(139,164,204,.05)'];\n  const shadeFns={};\n  cols.slice(1).forEach(c=>{\n    const vals=[...new Set(fams.map(f=>rawVal(f,c.k)).filter(v=>v!=null))].sort((a,b)=>b-a);\n    shadeFns[c.k]=v=>{ if(v==null||!vals.length) return null;\n      const tier=Math.min(4,Math.floor(vals.indexOf(v)*5/vals.length));\n      return SHADES[tier]; };\n  });\n  // Winners strip: the family (or families) at rank 1 per job. Arena ties are\n  // the board's own statistical tie (hi===1); AA has no rank band, so its tie\n  // is exact value equality.\n  function winnersFor(c){\n    const scored=fams.filter(f=>rawVal(f,c.k)!=null);\n    if(!scored.length) return null;\n    if(c.k.startsWith('ar_')){\n      const b=c.k.slice(3);\n      return scored.filter(f=>f.disp.arena[b].hi===1);\n    }\n    const max=Math.max(...scored.map(f=>rawVal(f,c.k)));\n    return scored.filter(f=>rawVal(f,c.k)===max);\n  }\n  let strip='';\n  cols.slice(1).forEach(c=>{\n    const w=winnersFor(c); if(!w) return;\n    const names=w.map(f=>baseName(f.head.name));\n    const tie=w.length>1?`\u003cspan class=\"bf-n\">${w.length}-way tie\u003c/span>`:'';\n    strip+=`\u003cspan class=\"bf-item\">\u003cspan class=\"bf-job\">${escA(c.t)}${tie}\u003c/span>`+\n      `\u003cspan class=\"bf-winner\">${names.map(n=>`\u003cspan class=\"bf-nm\">${escA(n)}\u003c/span>`).join(' \u00b7 ')}\u003c/span>\u003c/span>`;\n  });\n  document.getElementById('bfstrip').innerHTML=strip;\n  // Grid: default sort = Intel desc (Intel isn't a shown column here).\n  let sort={k:null,dir:1};\n  function cellHtml(f,c){\n    if(c.k==='name') return `\u003ctd class=\"l\">\u003cspan class=\"modelcell\" data-card=\"1\">${escA(baseName(f.head.name))}\u003c/span>\u003c/td>`;\n    const isArena=c.k.startsWith('ar_'), b=isArena?c.k.slice(3):null;\n    const a=isArena?(f.disp.arena||{})[b]:null;\n    const v=isArena?(a?a.r:null):f.disp[c.k];\n    if(v==null) return `\u003ctd title=\"Not yet rated\">\u003c/td>`;\n    const style=shadeFns[c.k](v)?` style=\"background:${shadeFns[c.k](v)}\"`:'';\n    let title,tie=false;\n    if(isArena){\n      tie=a.hi===1;\n      title=`${ARENA_BOARD[b]}. Rating ${a.r}, ${rankWords(a).replace(/\u003c[^>]+>/g,'')}. Rated variant: ${a.n}.`;\n    } else {\n      title=`${c.t} index ${fmt(v,1)}. Variant rated: ${f.bor[c.k]||effortOf(f.head.name)}.`;\n    }\n    return `\u003ctd${style} title=\"${escA(title)}\">\u003cspan class=\"${tie?'tie1':''}\">${isArena?a.r:fmt(v,1)}\u003c/span>\u003c/td>`;\n  }\n  function render(){\n    const el=document.getElementById('tbf');\n    const arr=[...fams].sort((x,y)=>{\n      if(!sort.k) return (y.head.intel||0)-(x.head.intel||0);\n      const a=rawVal(x,sort.k), b=rawVal(y,sort.k);\n      if(a==null&&b==null) return 0;\n      if(a==null) return 1; if(b==null) return -1;\n      return sort.dir===1?b-a:a-b;\n    });\n    let h='\u003cthead>\u003ctr>'+cols.map(c=>{const ar=sort.k===c.k?(sort.dir===1?' \u2193':' \u2191'):'';\n      return `\u003cth class=\"${c.l?'l':''}\" data-k=\"${c.k}\">${escA(c.t)}\u003cspan class=\"arrow\">${ar}\u003c/span>\u003c/th>`;}).join('')+\n      '\u003c/tr>\u003c/thead>\u003ctbody>';\n    h+=arr.map(f=>`\u003ctr data-key=\"${(f.head.slug||'').replace(/\"/g,'')}\">`+\n      cols.map(c=>cellHtml(f,c)).join('')+'\u003c/tr>').join('');\n    h+='\u003c/tbody>';\n    el.innerHTML=h;\n    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{\n      const k=th.dataset.k; if(k==='name') return;\n      sort=(sort.k===k)?{k,dir:-sort.dir}:{k,dir:1};\n      render();});\n    el.querySelectorAll('tbody tr').forEach((tr,i)=>{\n      const f=arr[i], cell=tr.querySelector('.modelcell');\n      if(cell){ cell.onmouseenter=()=>showCard(f.head,cell);\n        cell.onmouseleave=hideCardSoon;\n        cell.onclick=e=>{e.stopPropagation(); togglePin(f.head,cell);}; }\n    });\n  }\n  render();\n})();\n\n/* ---------- Benchmarks vs people: AA Intel vs Arena rating, per family ----------\n   Reuses famGroups/headOf from the Best-for grid so both sections agree on\n   \"the family\" and \"the head variant\". Arena's own confidence interval (r\u00b1ci,\n   already shown in the table tooltips) becomes the whisker: hi/lo are rank\n   bands, not rating bands, so ci is the field that actually answers \"how\n   uncertain is this rating\". */\n(function(){\n  const fams=famGroups(OVERALL,[{k:'name',t:'Model',l:1}]);\n  const BOARD_LABEL=Object.fromEntries(BOARDS);\n  // Geometry is recomputed each render from the container's real width, so the\n  // SVG draws 1:1 in CSS pixels and text stays readable on phones.\n  let W=820,H=460,m={l:58,r:22,t:20,b:54},narrow=false,lastW=0;\n  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\n  const noteEl=document.getElementById('bvpnote');\n  const missEl=document.getElementById('bvpmissing');\n  const chartEl=document.getElementById('bvpchart');\n  const gapsEl=document.getElementById('bvpgaps');\n  let board='text';\n\n  function pointsFor(b){\n    return fams.map(f=>{\n      const x=f.head.intel; const a=(f.head.arena||{})[b];\n      return {f, x, y:a?a.r:null, ci:a?a.ci:null, name:baseName(f.head.name)};\n    });\n  }\n  function ols(pts){\n    const n=pts.length;\n    const mx=pts.reduce((s,p)=>s+p.x,0)/n, my=pts.reduce((s,p)=>s+p.y,0)/n;\n    let sxy=0,sxx=0,syy=0;\n    pts.forEach(p=>{const dx=p.x-mx,dy=p.y-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy;});\n    const slope=sxx?sxy/sxx:0, intercept=my-slope*mx;\n    const r=(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;\n    return {slope,intercept,r};\n  }\n  function scoreOf(p,dxMin,dxMax,dyMin,dyMax){\n    return (dxMax>dxMin?(p.x-dxMin)/(dxMax-dxMin):0)+(dyMax>dyMin?(p.y-dyMin)/(dyMax-dyMin):0);\n  }\n\n  // Put each label in the first of 8 spots around its dot that hits no other dot,\n  // no already-placed label and stays inside the plot; else the least-bad spot.\n  function placeLabels(svg){\n    const R=7, dots=[...svg.querySelectorAll('.dot')].map(c=>({x:+c.getAttribute('cx'),y:+c.getAttribute('cy')}));\n    const inter=(a,b)=>Math.max(0,Math.min(a.x2,b.x2)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y2,b.y2)-Math.max(a.y,b.y));\n    const placed=[];\n    svg.querySelectorAll('.dlabel').forEach(t=>{\n      const cx=+t.dataset.cx, cy=+t.dataset.cy;\n      let w=0,h=0; try{const bb=t.getBBox(); w=bb.width; h=bb.height;}catch(e){}\n      if(!w){ w=t.textContent.length*7.6; h=14; }\n      const g=8, cands=[[cx+g,cy-h/2],[cx-g-w,cy-h/2],[cx-w/2,cy-g-h],[cx-w/2,cy+g],\n        [cx+g-2,cy-g-h+2],[cx+g-2,cy+g-2],[cx-g-w+2,cy-g-h+2],[cx-g-w+2,cy+g-2]];\n      let best=null,bestCost=Infinity;\n      for(const [x,y] of cands){\n        const box={x,y,x2:x+w,y2:y+h};\n        let cost=0;\n        if(x\u003cm.l||x+w>W-m.r||y\u003cm.t||y+h>H-m.b) cost+=1e6;\n        dots.forEach(d=>{ if(Math.abs(d.x-cx)\u003c.5&&Math.abs(d.y-cy)\u003c.5) return; cost+=inter(box,{x:d.x-R,y:d.y-R,x2:d.x+R,y2:d.y+R})*10; });\n        placed.forEach(b=>cost+=inter(box,b)*20);\n        if(cost\u003cbestCost){bestCost=cost;best=box;} if(cost===0) break;\n      }\n      placed.push(best);\n      t.setAttribute('text-anchor','start'); t.setAttribute('x',best.x.toFixed(1)); t.setAttribute('y',(best.y+h*0.78).toFixed(1));\n    });\n  }\n  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{\n    const cw=chartEl.clientWidth; if(cw&&Math.abs(cw-lastW)>16) render(); },150); });\n\n  function render(){\n    const cw=chartEl.clientWidth;\n    if(cw){ W=Math.max(300,Math.min(820,Math.round(cw))); lastW=cw; }\n    narrow=W\u003c560;\n    H=narrow?Math.round(W*1.0):460;\n    m=narrow?{l:60,r:12,t:26,b:46}:{l:58,r:22,t:20,b:54};\n    const all=pointsFor(board);\n    const missIntel=all.filter(p=>p.x==null).map(p=>p.name);\n    const missArena=all.filter(p=>p.x!=null&&p.y==null).map(p=>p.name);\n    const pts=all.filter(p=>p.x!=null&&p.y!=null);\n    const lbl=BOARD_LABEL[board];\n    if(pts.length\u003c2){\n      chartEl.innerHTML='\u003cp class=\"note\">Not enough families rated to plot a trend.\u003c/p>';\n      gapsEl.innerHTML='';\n      noteEl.textContent=`Not enough families rated on Arena ${lbl} yet to compare.`;\n      missEl.textContent=missArena.length?`Not rated on Arena ${lbl} yet: ${missArena.join(', ')}.`:'';\n      return;\n    }\n    const {slope,intercept,r}=ols(pts);\n    pts.forEach(p=>{p.fit=slope*p.x+intercept; p.resid=p.y-p.fit;});\n\n    const xsRaw=pts.map(p=>p.x), ysRaw=pts.map(p=>p.y);\n    const dxMin=Math.min(...xsRaw), dxMax=Math.max(...xsRaw);\n    const dyMin=Math.min(...ysRaw), dyMax=Math.max(...ysRaw);\n    const ciLo=pts.map(p=>p.y-(p.ci||0)), ciHi=pts.map(p=>p.y+(p.ci||0));\n    const cyMin=Math.min(...ciLo), cyMax=Math.max(...ciHi);\n    const xpad=(dxMax-dxMin)*0.1||2, ypad=(cyMax-cyMin)*0.12||10;\n    const xmin=dxMin-xpad, xmax=dxMax+xpad, ymin=cyMin-ypad, ymax=cyMax+ypad;\n    const X=v=>m.l+(v-xmin)/(xmax-xmin)*(W-m.l-m.r);\n    const Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);\n\n    const xstep=niceStep(xmax-xmin,narrow?4:6), ystep=niceStep(ymax-ymin,narrow?5:6);\n    const xTicks=[]; for(let v=Math.ceil(xmin/xstep)*xstep; v\u003c=xmax+1e-6; v+=xstep) xTicks.push(Math.round(v*10)/10);\n    const yTicks=[]; for(let v=Math.ceil(ymin/ystep)*ystep; v\u003c=ymax+1e-6; v+=ystep) yTicks.push(Math.round(v));\n\n    let s=`\u003csvg viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"xMidYMid meet\">`;\n    yTicks.forEach(v=>{const y=+Y(v).toFixed(1);\n      s+=`\u003cline class=\"gridline\" x1=\"${m.l}\" y1=\"${y}\" x2=\"${W-m.r}\" y2=\"${y}\"/>`;\n      s+=`\u003ctext class=\"tick\" x=\"${m.l-10}\" y=\"${y+4}\" text-anchor=\"end\">${v}\u003c/text>`;});\n    xTicks.forEach(v=>{const x=+X(v).toFixed(1);\n      s+=`\u003cline class=\"gridline\" x1=\"${x}\" y1=\"${m.t}\" x2=\"${x}\" y2=\"${H-m.b}\"/>`;\n      s+=`\u003ctext class=\"tick\" x=\"${x}\" y=\"${H-m.b+22}\" text-anchor=\"middle\">${v}\u003c/text>`;});\n    s+=`\u003cline class=\"axis\" x1=\"${m.l}\" y1=\"${H-m.b}\" x2=\"${W-m.r}\" y2=\"${H-m.b}\"/>`;\n    s+=`\u003cline class=\"axis\" x1=\"${m.l}\" y1=\"${m.t}\" x2=\"${m.l}\" y2=\"${H-m.b}\"/>`;\n    s+=`\u003ctext class=\"axislab\" x=\"${((m.l+(W-m.r))/2).toFixed(0)}\" y=\"${H-12}\" text-anchor=\"middle\">AA Intelligence Index \u2192\u003c/text>`;\n    s+=`\u003ctext class=\"axislab\" transform=\"translate(${narrow?12:16},${((m.t+(H-m.b))/2).toFixed(0)}) rotate(-90)\" text-anchor=\"middle\">Arena ${esc(lbl)} rating \u2191\u003c/text>`;\n    // trend: OLS fit, dashed & faint, spanning the plotted dots' own x range\n    s+=`\u003cline class=\"trend\" x1=\"${X(dxMin).toFixed(1)}\" y1=\"${Y(slope*dxMin+intercept).toFixed(1)}\" x2=\"${X(dxMax).toFixed(1)}\" y2=\"${Y(slope*dxMax+intercept).toFixed(1)}\"/>`;\n    // whiskers: Arena's own \u00b1ci around the rating\n    pts.forEach(p=>{ if(!p.ci) return; const x=X(p.x).toFixed(1);\n      s+=`\u003cline class=\"whisker\" x1=\"${x}\" y1=\"${Y(p.y-p.ci).toFixed(1)}\" x2=\"${x}\" y2=\"${Y(p.y+p.ci).toFixed(1)}\"/>`;});\n    // dots: diverging colour for a real gap, neutral within \u00b15 rating points of the trend\n    const colorFor=p=>p.resid>5?'var(--res-pos)':p.resid\u003c-5?'var(--res-neg)':'var(--closed)';\n    pts.forEach((p,i)=>{ const sign=p.resid>=0?'+':'';\n      s+=`\u003ccircle class=\"dot\" data-i=\"${i}\" data-key=\"${esc(p.f.head.slug||'')}\" cx=\"${X(p.x).toFixed(1)}\" cy=\"${Y(p.y).toFixed(1)}\" r=\"5.5\" fill=\"${colorFor(p)}\" fill-opacity=\".92\">\u003ctitle>${esc(p.name)}: ${sign}${p.resid.toFixed(0)} vs trend\u003c/title>\u003c/circle>`;});\n    s+=`\u003ctext class=\"capnote\" x=\"${m.l+8}\" y=\"${m.t+16}\">${narrow?'People rate it higher \u2191':'People rate it higher than its benchmarks \u2191'}\u003c/text>`;\n    s+=`\u003ctext class=\"capnote\" x=\"${W-m.r-8}\" y=\"${H-m.b-8}\" text-anchor=\"end\">${narrow?'Benchmarks rate it higher \u2193':'Benchmarks rate it higher than people \u2193'}\u003c/text>`;\n    // labels: 3 largest +residual, 3 largest -residual, + the top-right-most dot\n    const byPos=[...pts].sort((a,b)=>b.resid-a.resid).slice(0,3);\n    const byNeg=[...pts].sort((a,b)=>a.resid-b.resid).slice(0,3);\n    const topRight=[...pts].sort((a,b)=>scoreOf(b,dxMin,dxMax,dyMin,dyMax)-scoreOf(a,dxMin,dxMax,dyMin,dyMax))[0];\n    const labelSet=new Map();\n    // On phones there's room for the extremes only; the gaps list below names the rest.\n    [...(narrow?byPos.slice(0,1):byPos),...(narrow?byNeg.slice(0,1):byNeg),topRight].forEach(p=>{ if(p&&!labelSet.has(p.f.k)) labelSet.set(p.f.k,p); });\n    // Near the right edge a left-anchored label runs off the plot into the\n    // gaps list beside it (the SVG is overflow:visible, so it isn't clipped);\n    // flip those to anchor on their right side instead, same as the main\n    // scatter's hotlabel flip.\n    const labels=[...labelSet.values()].map(p=>{ const cx=X(p.x), flip=cx>W-m.r-130;\n      return {p,x:flip?cx-8:cx+8,y:Y(p.y)-8,anchor:flip?'end':'start'}; });\n    labels.sort((a,b)=>a.y-b.y);\n    for(let i=1;i\u003clabels.length;i++){ if(Math.abs(labels[i].y-labels[i-1].y)\u003c13&&Math.abs(labels[i].x-labels[i-1].x)\u003c90) labels[i].y=labels[i-1].y+13; }\n    labels.forEach(l=>{ s+=`\u003ctext class=\"dlabel\" data-cx=\"${X(l.p.x).toFixed(1)}\" data-cy=\"${Y(l.p.y).toFixed(1)}\" text-anchor=\"${l.anchor}\" x=\"${l.x.toFixed(1)}\" y=\"${l.y.toFixed(1)}\">${esc(l.p.name)}\u003c/text>`; });\n    s+=`\u003c/svg>`;\n    chartEl.innerHTML=s;\n\n    const svg=chartEl.querySelector('svg');\n    placeLabels(svg);\n    svg.querySelectorAll('.dot').forEach(c=>{ const p=pts[+c.dataset.i]; c.dataset.card='1';\n      c.addEventListener('mouseenter',()=>showCard(p.f.head,c));\n      c.addEventListener('mouseleave',hideCardSoon);\n      c.addEventListener('click',e=>{e.stopPropagation(); togglePin(p.f.head,c);});\n    });\n\n    function gapRow(p){ const sign=p.resid>=0?'+':'';\n      return `\u003cdiv class=\"bvp-gaprow\" data-card=\"1\" data-key=\"${esc(p.f.head.slug||'')}\">\u003cspan>${esc(p.name)}\u003c/span>`+\n        `\u003cspan class=\"bvp-gapval ${p.resid>=0?'pos':'neg'}\">${sign}${p.resid.toFixed(0)}\u003c/span>\u003c/div>`; }\n    let gh=`\u003cdiv class=\"bvp-gaptitle\">People rate it higher \u2191\u003c/div>${byPos.map(gapRow).join('')}`;\n    gh+=`\u003cdiv class=\"bvp-gaptitle\" style=\"margin-top:10px\">Benchmarks rate it higher \u2193\u003c/div>${byNeg.map(gapRow).join('')}`;\n    gapsEl.innerHTML=gh;\n    gapsEl.querySelectorAll('.bvp-gaprow').forEach(row=>{\n      const p=pts.find(pp=>(pp.f.head.slug||'')===row.dataset.key);\n      if(!p) return;\n      row.onmouseenter=()=>showCard(p.f.head,row);\n      row.onmouseleave=hideCardSoon;\n      row.onclick=()=>togglePin(p.f.head,row);\n    });\n\n    noteEl.textContent=`One dot per Frontier family. r = ${r.toFixed(2)} across ${pts.length} families on Arena ${lbl}.`;\n    const missBits=[];\n    if(missArena.length) missBits.push(`Not rated on Arena ${lbl} yet: ${missArena.join(', ')}.`);\n    if(missIntel.length) missBits.push(`No AA Intelligence Index yet: ${missIntel.join(', ')}.`);\n    missEl.textContent=missBits.join(' ');\n  }\n  document.querySelectorAll('[data-bv]').forEach(ch=>ch.onclick=()=>{\n    document.querySelectorAll('[data-bv]').forEach(c=>c.classList.remove('on')); ch.classList.add('on');\n    board=ch.dataset.bv; render();\n  });\n  render();\n})();\n\nopenFromHash(); HWIN.addEventListener('hashchange',openFromHash);\n// Embedded: the shell switches tabs by setting this frame's own hash to\n// \"#t=\u003ckey>\". Mirror it into the parent URL so a reload lands on the same tab.\nif(HWIN!==window) addEventListener('hashchange',()=>{\n  const t=hashParts(location.hash).t; if(t) selectTab(t); });\n\u003c/script>\n\u003c/body>\u003c/html>\n"</script>

me]) modelMap[m.name]={creator:m.creator,apps:new Array(APPS.length).fill(0),count:0};\n      modelMap[m.name].apps[ai]=m.tokens;\n      modelMap[m.name].count++;\n    });\n  });\n  return {modelMap,appNames:names};\n}\n\nfunction setActive(el) {\n  document.querySelectorAll('.app-item').forEach(e=>e.classList.remove('active'));\n  el.classList.add('active');\n}\n\nfunction renderSidebar() {\n  const list=document.getElementById('app-list');\n  APPS.forEach((app,i)=>{\n    const el=document.createElement('div');\n    el.className='app-item'; el.dataset.slug=app.slug;\n    el.innerHTML=`\n      \u003cdiv class=\"rank-badge ${i===0?'r1':''}\">${app.rank}\u003c/div>\n      \u003cdiv class=\"app-name\">${app.name}\u003c/div>\n      ${app.trend?`\u003cdiv class=\"trend ${app.trend.startsWith('-')?'down':'up'}\">${app.trend}\u003c/div>`:''}\n      \u003cdiv class=\"app-tokens\">${app.todayTokens||''}\u003c/div>`;\n    el.onclick=()=>showApp(app,el);\n    list.appendChild(el);\n  });\n}\n\nfunction showOverview(el) {\n  setActive(el);\n  const {modelMap,appNames}=buildCross();\n  const sorted=Object.entries(modelMap).sort((a,b)=>\n    b[1].count-a[1].count||(b[1].apps.reduce((s,v)=>s+v,0)-a[1].apps.reduce((s,v)=>s+v,0)));\n  const top15=sorted.slice(0,15);\n  const appTotals=APPS.map(app=>(app.models||[]).reduce((s,m)=>s+m.tokens,0));\n  const grandTotal=appTotals.reduce((s,v)=>s+v,0);\n  const creatorTotals={};\n  APPS.forEach(app=>(app.models||[]).forEach(m=>{\n    creatorTotals[m.creator]=(creatorTotals[m.creator]||0)+m.tokens;\n  }));\n  const allTok=Object.values(creatorTotals).reduce((s,v)=>s+v,0);\n  const topC=Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1])[0]||['?',0];\n  const topCpct=allTok?Math.round(topC[1]/allTok*100):0;\n  const mu=sorted[0]||['?',{count:0}];\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"section-title\">Cross-App Insights\u003c/div>\n    \u003cdiv class=\"insights-grid\">\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Most Universal Model\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:15px;color:#4a9eff\">${mu[0]}\u003c/div>\n        \u003cdiv class=\"sub\">In ${mu[1].count}/${APPS.length} apps with model data\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Dominant Creator\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:18px;color:${CREATORS[topC[0]]||'#fff'}\">${topC[0][0]?.toUpperCase()+topC[0].slice(1)}\u003c/div>\n        \u003cdiv class=\"sub\">${topCpct}% of cross-app token volume\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Total Token Volume\u003c/div>\n        \u003cdiv class=\"value\">${fmtT(Math.round(allTok))}\u003c/div>\n        \u003cdiv class=\"sub\">Across top ${APPS.length} apps this month\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"heatmap-wrap\">\n      \u003ch2>Model \u00d7 App Heatmap\u003c/h2>\n      \u003cp class=\"desc\">Top 15 models by breadth. Cell shading = token volume relative to that model's biggest app (row-normalized). Total column = model's tokens across these apps; App total row = each app's tokens across all its models.\u003c/p>\n      \u003ctable class=\"heatmap\">\n        \u003cthead>\u003ctr>\n          \u003cth class=\"model-col\">Model\u003c/th>\u003cth>Creator\u003c/th>\u003cth>Apps\u003c/th>\n          ${appNames.map(n=>`\u003cth>${n}\u003c/th>`).join('')}\u003cth class=\"total-col\">Total\u003c/th>\n        \u003c/tr>\u003c/thead>\n        \u003ctbody>\n          ${top15.map(([name,data])=>{\n            const maxT=Math.max(...data.apps)||1;\n            return `\u003ctr>\n              \u003ctd class=\"model-name\">\u003cspan class=\"cdot\" style=\"background:${CREATORS[data.creator]||'#555'}\">\u003c/span>${name}\u003c/td>\n              \u003ctd style=\"color:${CREATORS[data.creator]||'#999'};font-size:13px\">${data.creator}\u003c/td>\n              \u003ctd style=\"color:#a78bfa;font-weight:700\">${data.count}\u003c/td>\n              ${data.apps.map(t=>{\n                if(!t) return `\u003ctd>\u003cspan class=\"heat-cell heat-0\">\u2013\u003c/span>\u003c/td>`;\n                const lv=Math.min(5,Math.ceil((t/maxT)*5));\n                const lb=t>=1000?(t/1000).toFixed(1)+'T':Math.round(t)+'B';\n                return `\u003ctd title=\"${lb}\">\u003cspan class=\"heat-cell heat-${lv}\">${lb.replace('B','')}\u003c/span>\u003c/td>`;\n              }).join('')}\n              \u003ctd class=\"model-total\">${fmtT(Math.round(data.apps.reduce((s,v)=>s+v,0)))}\u003c/td>\n            \u003c/tr>`;\n          }).join('')}\n          \u003ctr class=\"totals-row\">\n            \u003ctd class=\"model-name\">App total\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\n            ${appTotals.map(t=>`\u003ctd>${fmtT(Math.round(t))}\u003c/td>`).join('')}\n            \u003ctd class=\"grand\">${fmtT(Math.round(grandTotal))}\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cdiv style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n        ${appNames.map((n,i)=>`\u003cspan style=\"font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--muted)\">${i+1}. ${APPS[i].name}\u003c/span>`).join('')}\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Share by Token Volume\u003c/h2>\n      \u003cp class=\"desc\">Aggregated across all top apps this month.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=allTok?Math.round(t/allTok*100):0;\n          if(pct\u003c1) return '';\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:110px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:18px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction showApp(app,el) {\n  setActive(el);\n  const cd={};\n  (app.models||[]).forEach(m=>{cd[m.creator]=(cd[m.creator]||0)+m.tokens;});\n  const total=(app.models||[]).reduce((s,m)=>s+m.tokens,0)||1;\n  const top=app.models?.[0]||{name:'?',creator:'other'};\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"app-header\">\u003cdiv>\n      \u003cdiv class=\"app-title\">#${app.rank} ${app.name}\u003c/div>\n      \u003cdiv class=\"app-desc\">${app.desc||''}\u003c/div>\n      \u003cdiv class=\"tags\">${(app.tags||[]).map(t=>`\u003cspan class=\"tag\">${t}\u003c/span>`).join('')}\u003c/div>\n      ${app.stale_from?`\u003cdiv class=\"stale\">model mix carried over from ${app.stale_from} \u2014 this app's page returned nothing on the last run\u003c/div>`:''}\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"stats-row\">\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Today\u003c/div>\u003cdiv class=\"s-value\">${app.todayTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">All-Time\u003c/div>\u003cdiv class=\"s-value\">${app.allTimeTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Global Rank\u003c/div>\u003cdiv class=\"s-value rank\">#${app.rank}\u003c/div>\u003c/div>\n      ${app.trend?`\u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Weekly Trend\u003c/div>\u003cdiv class=\"s-value\" style=\"color:${app.trend.startsWith('-')?'#f87171':'#4ade80'}\">${app.trend}\u003c/div>\u003c/div>`:''}\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Top Model\u003c/div>\n        \u003cdiv class=\"s-value\" style=\"font-size:14px;color:${CREATORS[top.creator]||'#fff'}\">${top.name}\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"chart-wrap\">\n      \u003ch2>Top ${(app.models||[]).length} Models This Month\u003c/h2>\n      \u003cp class=\"desc\">Token volume by model. Colors indicate AI lab.\u003c/p>\n      ${(app.models||[]).length===0?'\u003cdiv class=\"no-data\">No model data scraped for this app.\u003c/div>':''}\n      \u003cdiv class=\"bar-list\" id=\"app-chart\">\u003c/div>\n      \u003cdiv class=\"legend\" id=\"creator-legend\">\u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Mix\u003c/h2>\n      \u003cp class=\"desc\">Share of token volume by AI lab.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(cd).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=Math.round(t/total*100);\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:100px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:20px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n\n  const chartEl=document.getElementById('app-chart');\n  if(!chartEl) return;\n  const maxT=Math.max(...(app.models||[]).map(m=>m.tokens))||1;\n  chartEl.innerHTML=(app.models||[]).map(m=>{\n    const pct=Math.round((m.tokens/maxT)*100);\n    const col=CREATORS[m.creator]||'#555';\n    const lbl=fmtT(m.tokens);\n    return `\u003cdiv class=\"bar-row\">\n      \u003cdiv class=\"bar-label\" title=\"${m.name}\">${m.name}\u003c/div>\n      \u003cdiv class=\"bar-track\">\n        \u003cdiv class=\"bar-fill\" style=\"width:${pct}%;background:${col}cc;border:1px solid ${col}44\">\n          ${pct>20?`\u003cspan class=\"bar-fill-label\">${lbl}\u003c/span>`:''}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"bar-value\">${pct\u003c=20?lbl:''}\n        \u003cspan style=\"color:${col};font-size:12.5px;margin-left:4px\">${m.creator}\u003c/span>\u003c/div>\n    \u003c/div>`;\n  }).join('');\n\n  const lgd=document.getElementById('creator-legend');\n  if(lgd) lgd.innerHTML=[...new Set((app.models||[]).map(m=>m.creator))].map(c=>\n    `\u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-dot\" style=\"background:${CREATORS[c]||'#555'}\">\u003c/div>${c}\u003c/div>`\n  ).join('');\n}\n\nrenderSidebar();\nshowOverview(document.querySelector('.overview-item'));\n\u003c/script>\n\u003c/body>\u003c/html>"</script>
<script>
  const parse=id=>JSON.parse(document.getElementById(id).textContent);
  document.getElementById('f-model').srcdoc=parse('d-model');
  document.getElementById('f-apps').srcdoc=parse('d-apps');
  const frames={model:document.getElementById('f-model'),apps:document.getElementById('f-apps')};
  const tabs=[...document.querySelectorAll('.tab')];
  function activate(b){
    tabs.forEach(x=>x.classList.toggle('on',x===b));
    Object.values(frames).forEach(f=>f.classList.remove('on'));
    frames[b.dataset.t].classList.add('on');
  }
  tabs.forEach(b=>b.onclick=()=>{
    activate(b);
    // Same-origin srcdoc: set the model frame's own hash and let its handler
    // switch panels and mirror t= into this page's URL.
    if(b.dataset.key) frames.model.contentWindow.location.hash='#t='+b.dataset.key;
  });
  // On load, light the outer button that matches a #t= already in the URL.
  // The inner page reads the same hash itself, so no need to push it down.
  const t=(/(?:^#|&)t=([a-z]+)/.exec(location.hash)||[])[1];
  const init=t&&tabs.find(x=>x.dataset.key===t); if(init) activate(init);
</script>
