 Array(APPS.length).fill(0),count:0};\n      modelMap[m.name].apps[ai]=m.tokens;\n      modelMap[m.name].count++;\n    });\n  });\n  return {modelMap,appNames:names};\n}\n\nfunction setActive(el) {\n  document.querySelectorAll('.app-item').forEach(e=>e.classList.remove('active'));\n  el.classList.add('active');\n}\n\nfunction renderSidebar() {\n  const list=document.getElementById('app-list');\n  APPS.forEach((app,i)=>{\n    const el=document.createElement('div');\n    el.className='app-item'; el.dataset.slug=app.slug;\n    el.innerHTML=`\n      \u003cdiv class=\"rank-badge ${i===0?'r1':''}\">${app.rank}\u003c/div>\n      \u003cdiv class=\"app-name\">${app.name}\u003c/div>\n      ${app.trend?`\u003cdiv class=\"trend ${app.trend.startsWith('-')?'down':'up'}\">${app.trend}\u003c/div>`:''}\n      \u003cdiv class=\"app-tokens\">${app.todayTokens||''}\u003c/div>`;\n    el.onclick=()=>showApp(app,el);\n    list.appendChild(el);\n  });\n}\n\nfunction showOverview(el) {\n  setActive(el);\n  const {modelMap,appNames}=buildCross();\n  const sorted=Object.entries(modelMap).sort((a,b)=>\n    b[1].count-a[1].count||(b[1].apps.reduce((s,v)=>s+v,0)-a[1].apps.reduce((s,v)=>s+v,0)));\n  const top15=sorted.slice(0,15);\n  const appTotals=APPS.map(app=>(app.models||[]).reduce((s,m)=>s+m.tokens,0));\n  const grandTotal=appTotals.reduce((s,v)=>s+v,0);\n  const creatorTotals={};\n  APPS.forEach(app=>(app.models||[]).forEach(m=>{\n    creatorTotals[m.creator]=(creatorTotals[m.creator]||0)+m.tokens;\n  }));\n  const allTok=Object.values(creatorTotals).reduce((s,v)=>s+v,0);\n  const topC=Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1])[0]||['?',0];\n  const topCpct=allTok?Math.round(topC[1]/allTok*100):0;\n  const mu=sorted[0]||['?',{count:0}];\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"section-title\">Cross-App Insights\u003c/div>\n    \u003cdiv class=\"insights-grid\">\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Most Universal Model\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:15px;color:#4a9eff\">${mu[0]}\u003c/div>\n        \u003cdiv class=\"sub\">In ${mu[1].count}/${APPS.length} apps with model data\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Dominant Creator\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:18px;color:${CREATORS[topC[0]]||'#fff'}\">${topC[0][0]?.toUpperCase()+topC[0].slice(1)}\u003c/div>\n        \u003cdiv class=\"sub\">${topCpct}% of cross-app token volume\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Total Token Volume\u003c/div>\n        \u003cdiv class=\"value\">${fmtT(Math.round(allTok))}\u003c/div>\n        \u003cdiv class=\"sub\">Across top ${APPS.length} apps this month\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"heatmap-wrap\">\n      \u003ch2>Model \u00d7 App Heatmap\u003c/h2>\n      \u003cp class=\"desc\">Top 15 models by breadth. Cell shading = token volume relative to that model's biggest app (row-normalized). Total column = model's tokens across these apps; App total row = each app's tokens across all its models.\u003c/p>\n      \u003ctable class=\"heatmap\">\n        \u003cthead>\u003ctr>\n          \u003cth class=\"model-col\">Model\u003c/th>\u003cth>Creator\u003c/th>\u003cth>Apps\u003c/th>\n          ${appNames.map(n=>`\u003cth>${n}\u003c/th>`).join('')}\u003cth class=\"total-col\">Total\u003c/th>\n        \u003c/tr>\u003c/thead>\n        \u003ctbody>\n          ${top15.map(([name,data])=>{\n            const maxT=Math.max(...data.apps)||1;\n            return `\u003ctr>\n              \u003ctd class=\"model-name\">\u003cspan class=\"cdot\" style=\"background:${CREATORS[data.creator]||'#555'}\">\u003c/span>${name}\u003c/td>\n              \u003ctd style=\"color:${CREATORS[data.creator]||'#999'};font-size:13px\">${data.creator}\u003c/td>\n              \u003ctd style=\"color:#a78bfa;font-weight:700\">${data.count}\u003c/td>\n              ${data.apps.map(t=>{\n                if(!t) return `\u003ctd>\u003cspan class=\"heat-cell heat-0\">\u2013\u003c/span>\u003c/td>`;\n                const lv=Math.min(5,Math.ceil((t/maxT)*5));\n                const lb=t>=1000?(t/1000).toFixed(1)+'T':Math.round(t)+'B';\n                return `\u003ctd title=\"${lb}\">\u003cspan class=\"heat-cell heat-${lv}\">${lb.replace('B','')}\u003c/span>\u003c/td>`;\n              }).join('')}\n              \u003ctd class=\"model-total\">${fmtT(Math.round(data.apps.reduce((s,v)=>s+v,0)))}\u003c/td>\n            \u003c/tr>`;\n          }).join('')}\n          \u003ctr class=\"totals-row\">\n            \u003ctd class=\"model-name\">App total\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\n            ${appTotals.map(t=>`\u003ctd>${fmtT(Math.round(t))}\u003c/td>`).join('')}\n            \u003ctd class=\"grand\">${fmtT(Math.round(grandTotal))}\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cdiv style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n        ${appNames.map((n,i)=>`\u003cspan style=\"font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--muted)\">${i+1}. ${APPS[i].name}\u003c/span>`).join('')}\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Share by Token Volume\u003c/h2>\n      \u003cp class=\"desc\">Aggregated across all top apps this month.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=allTok?Math.round(t/allTok*100):0;\n          if(pct\u003c1) return '';\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:110px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:18px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction showApp(app,el) {\n  setActive(el);\n  const cd={};\n  (app.models||[]).forEach(m=>{cd[m.creator]=(cd[m.creator]||0)+m.tokens;});\n  const total=(app.models||[]).reduce((s,m)=>s+m.tokens,0)||1;\n  const top=app.models?.[0]||{name:'?',creator:'other'};\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"app-header\">\u003cdiv>\n      \u003cdiv class=\"app-title\">#${app.rank} ${app.name}\u003c/div>\n      \u003cdiv class=\"app-desc\">${app.desc||''}\u003c/div>\n      \u003cdiv class=\"tags\">${(app.tags||[]).map(t=>`\u003cspan class=\"tag\">${t}\u003c/span>`).join('')}\u003c/div>\n      ${app.stale_from?`\u003cdiv class=\"stale\">model mix carried over from ${app.stale_from} \u2014 this app's page returned nothing on the last run\u003c/div>`:''}\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"stats-row\">\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Today\u003c/div>\u003cdiv class=\"s-value\">${app.todayTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">All-Time\u003c/div>\u003cdiv class=\"s-value\">${app.allTimeTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Global Rank\u003c/div>\u003cdiv class=\"s-value rank\">#${app.rank}\u003c/div>\u003c/div>\n      ${app.trend?`\u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Weekly Trend\u003c/div>\u003cdiv class=\"s-value\" style=\"color:${app.trend.startsWith('-')?'#f87171':'#4ade80'}\">${app.trend}\u003c/div>\u003c/div>`:''}\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Top Model\u003c/div>\n        \u003cdiv class=\"s-value\" style=\"font-size:14px;color:${CREATORS[top.creator]||'#fff'}\">${top.name}\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"chart-wrap\">\n      \u003ch2>Top ${(app.models||[]).length} Models This Month\u003c/h2>\n      \u003cp class=\"desc\">Token volume by model. Colors indicate AI lab.\u003c/p>\n      ${(app.models||[]).length===0?'\u003cdiv class=\"no-data\">No model data scraped for this app.\u003c/div>':''}\n      \u003cdiv class=\"bar-list\" id=\"app-chart\">\u003c/div>\n      \u003cdiv class=\"legend\" id=\"creator-legend\">\u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Mix\u003c/h2>\n      \u003cp class=\"desc\">Share of token volume by AI lab.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(cd).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=Math.round(t/total*100);\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:100px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:20px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n\n  const chartEl=document.getElementById('app-chart');\n  if(!chartEl) return;\n  const maxT=Math.max(...(app.models||[]).map(m=>m.tokens))||1;\n  chartEl.innerHTML=(app.models||[]).map(m=>{\n    const pct=Math.round((m.tokens/maxT)*100);\n    const col=CREATORS[m.creator]||'#555';\n    const lbl=fmtT(m.tokens);\n    return `\u003cdiv class=\"bar-row\">\n      \u003cdiv class=\"bar-label\" title=\"${m.name}\">${m.name}\u003c/div>\n      \u003cdiv class=\"bar-track\">\n        \u003cdiv class=\"bar-fill\" style=\"width:${pct}%;background:${col}cc;border:1px solid ${col}44\">\n          ${pct>20?`\u003cspan class=\"bar-fill-label\">${lbl}\u003c/span>`:''}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"bar-value\">${pct\u003c=20?lbl:''}\n        \u003cspan style=\"color:${col};font-size:12.5px;margin-left:4px\">${m.creator}\u003c/span>\u003c/div>\n    \u003c/div>`;\n  }).join('');\n\n  const lgd=document.getElementById('creator-legend');\n  if(lgd) lgd.innerHTML=[...new Set((app.models||[]).map(m=>m.creator))].map(c=>\n    `\u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-dot\" style=\"background:${CREATORS[c]||'#555'}\">\u003c/div>${c}\u003c/div>`\n  ).join('');\n}\n\nrenderSidebar();\nshowOverview(document.querySelector('.overview-item'));\n\u003c/script>\n\u003c/body>\u003c/html>"</script>
<script>
  const parse=id=>JSON.parse(document.getElementById(id).textContent);
  document.getElementById('f-model').srcdoc=parse('d-model');
  document.getElementById('f-apps').srcdoc=parse('d-apps');
  const frames={model:document.getElementById('f-model'),apps:document.getElementById('f-apps')};
  const tabs=[...document.querySelectorAll('.tab')];
  function activate(b){
    tabs.forEach(x=>x.classList.toggle('on',x===b));
    Object.values(frames).forEach(f=>f.classList.remove('on'));
    frames[b.dataset.t].classList.add('on');
  }
  tabs.forEach(b=>b.onclick=()=>{
    activate(b);
    // Same-origin srcdoc: set the model frame's own hash and let its handler
    // switch panels and mirror t= into this page's URL.
    if(b.dataset.key) frames.model.contentWindow.location.hash='#t='+b.dataset.key;
  });
  // On load, light the outer button that matches a #t= already in the URL.
  // The inner page reads the same hash itself, so no need to push it down.
  const t=(/(?:^#|&)t=([a-z]+)/.exec(location.hash)||[])[1];
  const init=t&&tabs.find(x=>x.dataset.key===t); if(init) activate(init);
</script>
</body></html>
