<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Dashboard</title>
<style>
  :root{--bg:#0b0d11;--bar:#12151c;--line:#262d39;--ink:#e7edf6;--mut:#94a0b2;
    --faint:#616b7a;--accent:#7c9cf2}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-size:15px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;gap:18px;height:58px;padding:0 22px;
    background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .brand span{color:var(--mut);font-weight:400}
  nav{display:flex;gap:8px}
  .tab{appearance:none;background:transparent;border:1px solid transparent;color:var(--mut);
    font-size:15px;font-weight:500;padding:8px 16px;border-radius:9px;cursor:pointer;
    font-family:inherit;line-height:1}
  .tab:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .tab.on{color:#dce8ff;background:#1f2a3b;border-color:#34506f}
  .stamp{margin-left:auto;color:var(--faint);font-size:13.5px;white-space:nowrap;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .frames{position:relative;height:calc(100vh - 58px)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
  iframe.on{display:block}
  @media(max-width:680px){.stamp{display:none}.brand span{display:none}}
</style></head>

</div>

<script id="d-model" type="application/json">"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>AI Model Dashboard\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#0e1014; --panel:#161a22; --panel2:#1b2029; --line:#262d39;\n  --ink:#e7edf6; --mut:#94a0b2; --faint:#616b7a;\n  --cn:#f08a63; --oss:#5fb2f2; --closed:#aeb9c7;\n  --good:#74c97c; --grid:#1f2530;\n  --mono:\"SF Mono\",ui-monospace,Menlo,Consolas,monospace;\n  --sans:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Inter,Roboto,sans-serif;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1760px;margin:0 auto;padding:38px 28px 90px}\nh1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}\n.sub{color:var(--mut);font-size:14px;margin-bottom:30px}\n.sub b{color:var(--ink);font-weight:500}\nh2{font-size:18px;font-weight:600;margin:42px 0 5px;letter-spacing:-.01em}\n.note{color:var(--faint);font-size:14px;margin:0 0 16px;max-width:820px}\n.panel{background:linear-gradient(180deg,#171c25,#13171e);border:1px solid var(--line);border-radius:12px;padding:20px 20px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}\n/* scatter */\n.chartwrap{position:relative}\nsvg{display:block;width:100%;height:auto;overflow:visible}\n.axis{stroke:#39424f;stroke-width:1}\n.gridline{stroke:rgba(255,255,255,.05);stroke-width:1}\n.axislab{fill:var(--mut);font-size:14px;font-family:var(--sans)}\n.tick{fill:var(--faint);font-size:13px;font-family:var(--mono)}\n.frontier{fill:none;stroke:var(--good);stroke-width:1.7;stroke-dasharray:5 4;opacity:.9;stroke-linejoin:round;stroke-linecap:round}\n.dot{cursor:pointer;transition:r .12s ease,fill-opacity .12s}\n.dot.fr{filter:url(#glow)}\n.dot:hover{stroke:#fff;stroke-width:1.5}\n.dot.hot{r:8.5px;fill-opacity:1;stroke:#fff;stroke-width:2;filter:url(#glow)}\n.dlabel{fill:#c2ccd9;font-size:13px;font-family:var(--mono);pointer-events:none;paint-order:stroke;stroke:#0e1014;stroke-width:3px}\n.hotlabel{fill:#fff;font-size:14px;font-family:var(--sans);font-weight:600;pointer-events:none;paint-order:stroke;stroke:#0e1014;stroke-width:3.5px}\n.legend{display:flex;gap:20px;align-items:center;font-size:14px;color:var(--mut);margin:6px 2px 14px;flex-wrap:wrap}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}\n.tip{position:absolute;pointer-events:auto;background:rgba(10,12,16,.93);backdrop-filter:blur(4px);border:1px solid #313a48;\n  border-radius:9px;padding:11px 13px;font-size:14px;opacity:0;transition:opacity .08s;z-index:9;min-width:188px;box-shadow:0 8px 24px rgba(0,0,0,.5)}\n.tip b{font-weight:600}.tip .r{color:var(--mut);font-size:13px}\n.tip table{border-collapse:collapse;margin-top:6px}.tip td{padding:1.5px 0}.tip td:last-child{text-align:right;font-family:var(--mono);padding-left:16px}\n/* controls */\n.controls{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}\n.gfilters{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:9px}\ninput.search{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);\n  padding:8px 12px;font-size:14px;width:250px;font-family:var(--sans)}\ninput.search::placeholder{color:var(--faint)}\n.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:20px;\n  padding:6px 15px;font-size:14px;cursor:pointer;user-select:none}\n.chip.on{background:#23303f;border-color:#36506b;color:#cfe3f7}\n.cnt{color:var(--faint);font-size:14px;margin-left:auto;font-family:var(--mono)}\n/* table */\ntable.grid{width:100%;border-collapse:collapse;font-size:14px}\ntable.grid th,table.grid td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\ntable.grid th{position:sticky;top:0;background:var(--bg);color:var(--mut);font-weight:500;\n  text-align:right;cursor:pointer;user-select:none;font-size:14px}\ntable.grid th.l,table.grid td.l{text-align:left}\ntable.grid th:hover{color:var(--ink)}\ntable.grid td{text-align:right;font-family:var(--mono);color:var(--ink)}\ntable.grid td.l{font-family:var(--sans)}\ntable.grid tbody tr:hover td{background:#1c222c}\n.modelcell{font-weight:500;display:inline-block;max-width:280px;overflow:hidden;text-overflow:ellipsis;\n  white-space:nowrap;vertical-align:middle}\n.modelcell a.mlink{color:inherit;text-decoration:none}\n.modelcell a.mlink:hover{text-decoration:underline;text-decoration-color:var(--faint)}\n.modelcell.nomatch{color:var(--faint);font-weight:400}\n/* family rows (Frontier): fixed-width expander slot on every row so names stay\n   aligned whether or not a row has one; sub-rows dim and indent the name only */\n.exp{display:inline-block;width:16px;margin-right:2px;text-align:center;color:var(--faint);font-size:12px;\n  vertical-align:middle;user-select:none}\n.exp[data-fam]{cursor:pointer}\n.exp[data-fam]:hover{color:var(--ink)}\n.nset{color:var(--faint);font-size:12px;font-family:var(--sans);font-weight:400;margin-left:7px;vertical-align:middle}\ntr.sub td{background:rgba(0,0,0,.22)}\ntr.sub .modelcell{margin-left:22px;font-weight:400;color:var(--mut)}\n/* a family-row value borrowed from a lower effort setting (see fillHead) */\n.borrowed{color:var(--faint);font-style:italic}\n/* Best for\u2026 section: winners strip + per-job grid */\n.bfstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 22px;\n  margin:0 0 16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:9px}\n.bf-item{display:flex;flex-direction:column;gap:3px;font-size:14px;min-width:0}\n.bf-job{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}\n.bf-job .bf-n{text-transform:none;letter-spacing:0;color:var(--faint);margin-left:6px}\n.bf-winner{color:var(--ink);font-weight:600;line-height:1.35}\n.bf-nm{white-space:nowrap}\n#tbf td:first-child{width:220px}\n#tbf .modelcell{max-width:200px}\n.linkrow{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}\n.mlink-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--sans);font-weight:600;\n  padding:1.5px 6px;border-radius:9px;text-decoration:none;border:1px solid transparent;\n  letter-spacing:.02em;transition:all .1s;opacity:.85}\n.mlink-chip:hover{opacity:1;transform:translateY(-1px)}\n.mlink-chip.or{background:rgba(95,178,242,.12);color:var(--oss);border-color:rgba(95,178,242,.3)}\n.mlink-chip.or:hover{background:rgba(95,178,242,.22)}\n.mlink-chip.aa{background:rgba(116,201,124,.12);color:var(--good);border-color:rgba(116,201,124,.3)}\n.mlink-chip.aa:hover{background:rgba(116,201,124,.22)}\n.mlink-chip svg{width:9px;height:9px}\n.tag{font-size:12px;font-family:var(--mono);padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:middle}\n.tag.cn{background:rgba(240,138,99,.18);color:var(--cn)}\n.tag.os{background:rgba(95,178,242,.18);color:var(--oss)}\n.crt{color:var(--mut);font-size:13.5px}\n.bar{position:relative}\n.bar span{position:absolute;left:0;top:0;bottom:0;background:rgba(116,201,124,.18);border-radius:2px;z-index:0}\n.bar em{position:relative;z-index:1;font-style:normal}\n.up{color:var(--faint)}\n.arrow{color:var(--good)}\n.tie1{color:var(--good);font-weight:600}\n.warnnote{color:var(--cn);font-size:13.5px;margin:0 0 12px}\n/* model card */\n.modelcell{cursor:pointer}\n.mcard{position:fixed;z-index:60;width:360px;max-width:calc(100vw - 16px);background:rgba(10,12,16,.97);\n  backdrop-filter:blur(4px);border:1px solid #313a48;border-radius:10px;padding:12px 14px;font-size:13.5px;\n  line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .08s;left:0;top:0}\n.mcard.on{opacity:1;visibility:visible}\n.mcard.pinned{border-color:#46607e;box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 0 1px rgba(124,156,242,.15)}\n.mc-h b{font-size:15px;font-weight:600}\n.mc-sub,.mc-facts{color:var(--mut);font-size:12.5px;margin-top:1px}\n.mc-facts{margin-top:6px}\n.mc-sec{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:11px 0 3px}\n.mc-t{width:100%;border-collapse:collapse}\n.mc-t td{padding:2px 0 2px 12px;font-family:var(--mono);text-align:right;white-space:nowrap}\n.mc-t td.l{text-align:left;font-family:var(--sans);padding-left:0;color:var(--mut)}\n.mc-t td.w{font-family:var(--sans);color:var(--mut);font-size:12.5px}\n.mc-t tr.hd td{color:var(--faint);font-family:var(--sans);font-size:11.5px}\n.mc-t tr.cur td{color:#fff;font-weight:600}\n.mc-t tr.cur td.l::before{content:'\u25b8 ';color:var(--good)}\n.mc-muted{color:var(--faint);font-size:12.5px;margin-top:3px}\n.mc-links{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}\n.mlink-chip.ar{background:rgba(148,160,178,.12);color:var(--mut);border-color:rgba(148,160,178,.3)}\nfooter{margin-top:48px;color:var(--faint);font-size:14px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}\nfooter a{color:var(--mut)}\n@media(max-width:720px){.wrap{padding:22px 14px}body{font-size:15.5px}.dlabel{display:none}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv class=\"wrap\">\n\u003ch1>AI Model Dashboard\u003c/h1>\n\u003cdiv class=\"sub\">Frontier language models &middot; intelligence, price &amp; speed &middot; as of \u003cb>2026-09-27 18:14 EDT\u003c/b>\n &middot; 674 AA models &times; 458 OpenRouter listings &times; 409 Arena ratings\u003c/div>\n\n\u003ch2>Price &times; Intelligence frontier\u003c/h2>\n\u003cp class=\"note\">Each dot is a model. Up = smarter (AA Intelligence Index). Left = cheaper (blended $/M tokens, 3:1 input:output, log scale).\nThe dashed line is the efficient frontier \u2014 the most intelligence available at each price. Models near it are the value plays.\u003c/p>\n\u003cdiv class=\"legend\">\n  \u003cspan>\u003ci style=\"background:var(--closed)\">\u003c/i>Closed / US &amp; other\u003c/span>\n  \u003cspan>\u003ci style=\"background:var(--oss)\">\u003c/i>Open-weight\u003c/span>\n  \u003cspan>\u003ci style=\"background:var(--cn)\">\u003c/i>Chinese lab\u003c/span>\n  \u003cspan style=\"color:var(--good)\">\u2013 \u2013 efficient frontier\u003c/span>\n\u003c/div>\n\u003cdiv class=\"panel chartwrap\">\u003cdiv id=\"scatter\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"frontier\">Frontier \u2014 AA Intelligence Index &ge; 40\u003c/h2>\n\u003cp class=\"note\">Two independent reads on quality. \u003cb>Intel\u003c/b> is Artificial Analysis's benchmark composite: what the model scores on tests.\n\u003cb>Arena\u003c/b> is the blind human-preference rating from arena.ai's text leaderboard; \u003cb>WebDev\u003c/b> is the same for building web apps.\n\u003cspan class=\"tie1\">Green\u003c/span> = statistically tied for first: the votes can't separate it from the top-rated model. Hover any rating for its range.\nArena rates one variant per model family, so every effort level of a family shows that family's rating. Blank = not yet rated.\u003c/p>\n\n\u003cdiv class=\"gfilters\">\n  \u003cspan style=\"color:var(--mut);font-size:14px;font-weight:500;margin-right:4px\">Filters:\u003c/span>\n  \u003cspan class=\"chip on\" data-gf=\"small\">Hide &lt;12B params\u003c/span>\n  \u003cspan class=\"chip on\" data-gf=\"old\">Hide &gt;1yr old\u003c/span>\n  \u003cspan class=\"chip on\" data-gf=\"low\">Hide intel &lt; 20\u003c/span>\n  \u003cspan style=\"color:var(--faint);font-size:13.5px;margin-left:4px\">\u00b7 click to toggle \u00b7 applies to both tables\u003c/span>\n\u003c/div>\n\u003cdiv class=\"controls\">\n  \u003cinput class=\"search\" id=\"s1\" placeholder=\"filter models or labs\u2026\">\n  \u003cspan class=\"cnt\" id=\"c1\">\u003c/span>\n\u003c/div>\n\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"grid\" id=\"t1\">\u003c/table>\u003c/div>\n\n\u003ch2 id=\"best-for\">Best for&hellip;\u003c/h2>\n\u003cp class=\"note\">Same Frontier families as above, one row each, scored against each job Arena and Artificial Analysis track. Arena Search has too few ratings to rank yet; it's in each model's card. Darker green is stronger within that column; blank means not yet rated.\u003c/p>\n\u003cdiv class=\"bfstrip\" id=\"bfstrip\">\u003c/div>\n\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"grid\" id=\"tbf\">\u003c/table>\u003c/div>\n\n\u003ch2>Chinese &amp; open-weight models\u003c/h2>\n\u003cp class=\"note\">The models you can self-host or that ship open weights, plus everything from Chinese labs. Tap a chip to narrow.\u003c/p>\n\u003cdiv class=\"controls\">\n  \u003cinput class=\"search\" id=\"s2\" placeholder=\"filter\u2026\">\n  \u003cspan class=\"chip on\" data-f=\"all\">All\u003c/span>\n  \u003cspan class=\"chip\" data-f=\"china\">Chinese\u003c/span>\n  \u003cspan class=\"chip\" data-f=\"open\">Open-weight\u003c/span>\n  \u003cspan class=\"cnt\" id=\"c2\">\u003c/span>\n\u003c/div>\n\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"grid\" id=\"t2\">\u003c/table>\u003c/div>\n\n\u003cfooter>\nData: model quality, throughput, latency &amp; pricing from\n\u003ca href=\"https://artificialanalysis.ai/\" target=\"_blank\" rel=\"noopener\">Artificial Analysis\u003c/a>\n(Intelligence Index v4); context window &amp; open-weight signal from\n\u003ca href=\"https://openrouter.ai/\" target=\"_blank\" rel=\"noopener\">OpenRouter\u003c/a>;\nhuman-preference ratings from \u003ca href=\"https://arena.ai/leaderboard\" target=\"_blank\" rel=\"noopener\">Arena\u003c/a>\n(text, style-controlled; WebDev), joined to AA at model-family level.\nThroughput = AA median output tokens/sec; latency = median time-to-first-token.\nBlended price weights input:output 3:1. Intelligence-per-$ = index &divide; blended $/M.\nRegenerated weekly (Fridays). Generated 2026-09-27 18:14 EDT.\n\u003c/footer>\n\u00 {H-m.b+22}\" text-anchor=\"middle\">$${v}\u003c/text>`;}});\n  // axes\n  s+=`\u003cline class=\"axis\" x1=\"${m.l}\" y1=\"${H-m.b}\" x2=\"${W-m.r}\" y2=\"${H-m.b}\"/>`;\n  s+=`\u003cline class=\"axis\" x1=\"${m.l}\" y1=\"${m.t}\" x2=\"${m.l}\" y2=\"${H-m.b}\"/>`;\n  s+=`\u003ctext class=\"axislab\" x=\"${((m.l+(W-m.r))/2).toFixed(0)}\" y=\"${H-14}\" text-anchor=\"middle\">\u2190 cheaper    \u00b7    blended price, $ / 1M tokens (log)    \u00b7    pricier \u2192\u003c/text>`;\n  s+=`\u003ctext class=\"axislab\" transform=\"translate(18,${((m.t+(H-m.b))/2).toFixed(0)}) rotate(-90)\" text-anchor=\"middle\">AA Intelligence Index    \u00b7    smarter \u2191\u003c/text>`;\n  // frontier line\n  s+=`\u003cpolyline class=\"frontier\" points=\"${fr.map(p=>X(p.blended).toFixed(1)+','+Y(p.intel).toFixed(1)).join(' ')}\"/>`;\n  // dots\n  pts.forEach((p,i)=>{ const onfr=frset.has(p);\n    s+=`\u003ccircle class=\"dot${onfr?' fr':''}\" data-i=\"${i}\" data-key=\"${esc(p.slug)}\" cx=\"${X(p.blended).toFixed(1)}\" cy=\"${Y(p.intel).toFixed(1)}\" r=\"${onfr?5.5:3.8}\" fill=\"${col(p)}\" fill-opacity=\"${onfr?0.98:0.5}\"/>`;});\n  // frontier labels\n  fr.forEach(p=>{ s+=`\u003ctext class=\"dlabel\" x=\"${(X(p.blended)+9).toFixed(1)}\" y=\"${(Y(p.intel)+4).toFixed(1)}\">${esc(p.name)}\u003c/text>`;});\n  s+=`\u003ctext class=\"hotlabel\" id=\"hotlabel\" x=\"0\" y=\"0\" style=\"opacity:0\">\u003c/text>`;\n  s+=`\u003c/svg>`;\n  document.getElementById('scatter').innerHTML=s;\n  const svg=document.querySelector('#scatter svg');\n  const hotlabel=document.getElementById('hotlabel');\n  const byKey={};\n  // Dots use the same model card as the tables (defined below): hover shows,\n  // click pins. The old chart-only tooltip is gone.\n  svg.querySelectorAll('.dot').forEach(c=>{ byKey[c.dataset.key]=c;\n    const p=pts[+c.dataset.i]; c.dataset.card='1';\n    c.addEventListener('mouseenter',()=>showCard(p,c));\n    c.addEventListener('mouseleave',hideCardSoon);\n    c.addEventListener('click',e=>{e.stopPropagation(); togglePin(p,c);});\n  });\n  // cross-link: highlight a dot when a table row is hovered\n  window.HI=function(key){ const c=byKey[key]; if(!c) return;\n    c.classList.add('hot'); c.parentNode.appendChild(c);\n    const p=pts[+c.dataset.i], cx=+c.getAttribute('cx'), cy=+c.getAttribute('cy');\n    let lx2=cx+12, anc='start'; if(cx>W-180){lx2=cx-12; anc='end';}\n    hotlabel.textContent=p.name; hotlabel.setAttribute('x',lx2.toFixed(1));\n    hotlabel.setAttribute('y',(cy-10).toFixed(1)); hotlabel.setAttribute('text-anchor',anc);\n    c.parentNode.appendChild(hotlabel); hotlabel.style.opacity=1; };\n  window.UN=function(key){ if(key){const c=byKey[key]; if(c) c.classList.remove('hot');}\n    else svg.querySelectorAll('.dot.hot').forEach(c=>c.classList.remove('hot'));\n    hotlabel.style.opacity=0; };\n})();\n\n/* ---------- tables ---------- */\n// Column catalogue; each table picks its own subset. Release date lives in the\n// model-name tooltip rather than a column: it cost width on every row and the\n// \"Hide >1yr old\" filter already acts on it.\nconst C={\n  name:   {k:'name',  t:'Model',     l:1, r:d=>modelCell(d)},\n  params: {k:'params', t:'Params',   r:d=>d.params!=null?d.params+'B':'\u00b7'},\n  intel:  {k:'intel', t:'Intel',     bar:'intel', r:d=>fmt(d.intel,1)},\n  coding: {k:'coding',t:'Code',      r:d=>fmt(d.coding,1)},\n  agent:  {k:'agent', t:'Agent',     r:d=>fmt(d.agent,1)},\n  ar_text:{k:'ar_text',  t:'Arena',  r:d=>arenaCell(d,'text')},\n  ar_web: {k:'ar_webdev',t:'WebDev', r:d=>arenaCell(d,'webdev')},\n  ctx:    {k:'ctx',   t:'Context',   r:d=>ctxf(d.ctx)},\n  p_in:   {k:'p_in',  t:'$ In',      r:d=>money(d.p_in)},\n  p_out:  {k:'p_out', t:'$ Out',     r:d=>money(d.p_out)},\n  blended:{k:'blended',t:'Blended',  r:d=>money(d.blended)},\n  tput:   {k:'tput',  t:'Tok/s',     r:d=>fmt(d.tput,0)},\n  ttft:   {k:'ttft',  t:'TTFT s',    r:d=>fmt(d.ttft,2)},\n  ipd:    {k:'ipd',   t:'Intel/$',   bar:'ipd', r:d=>fmt(d.ipd,1)},\n};\nconst pick=ks=>ks.map(k=>C[k]);\n// Frontier: frontier labs don't publish parameter counts (0 of the rows have\n// one) and context is 0.5\u20131.3M across the board, so both columns are dropped.\nconst COLS_FRONTIER=pick(['name','intel','coding','agent','ar_text','ar_web','p_in','p_out','blended','tput','ttft','ipd']);\n// Open & Chinese: params matter for self-hosting and context ranges 8K\u20131.3M.\nconst COLS_OSS=pick(['name','params','intel','coding','agent','ar_text','ar_web','ctx','p_in','p_out','blended','tput','ttft','ipd']);\nfunction modelLinks(d){\n  let l='\u003cspan class=\"linkrow\">';\n  l+=`\u003ca class=\"mlink-chip aa\" href=\"https://artificialanalysis.ai/models/${encodeURIComponent(d.slug||'')}\" target=\"_blank\" rel=\"noopener\" title=\"Artificial Analysis model page\" onclick=\"event.stopPropagation()\">${AA_ICON}AA\u003c/a>`;\n  l+='\u003c/span>';\n  return l;\n}\n// AA spells effort levels \"(Adaptive Reasoning, Xhigh Effort, Default Fallback)\"\n// (Anthropic) or \"(Reasoning, Max Effort)\" (DeepSeek and others), which truncates\n// to the same prefix on every row and hides the one word that tells them apart.\n// Show \"(xhigh)\", as AA already does for GPT/Grok; non-reasoning variants keep\n// that qualifier. The model card shows the same short name; AA's page has the full one.\nconst shortName=n=>(n||'').replace(/\\((Adaptive Reasoning|Reasoning|Non-?reasoning),\\s*(\\w+)\\s+Effort(?:,[^)]*)?\\)/i,\n  (m,k,e)=>/^non/i.test(k)?`(non-reasoning, ${e.toLowerCase()})`:`(${e.toLowerCase()})`);\n// label: text shown instead of the short name (family base name, or the effort\n// label on a sub-row); extra: html placed after the name (the settings count).\nfunction modelCell(d,label,extra){let t='';if(d.china)t+='\u003cspan class=\"tag cn\">CN\u003c/span>';if(d.open)t+='\u003cspan class=\"tag os\">OSS\u003c/span>';\n  // The name opens the model card (hover) and pins it (click); the OpenRouter\n  // link moved into the card. No native title tooltip: two at once is worse.\n  const cls=d.or_id?'modelcell':'modelcell nomatch';\n  return `\u003cspan class=\"${cls}\">${escA(label==null?shortName(d.name):label)}\u003c/span>${extra||''}${t}${modelLinks(d)}`;}\nfunction maxOf(rows,k){return Math.max(...rows.map(r=>r[k]||0))||1;}\nconst escA=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nconst BOARDS=[['webdev','WebDev'],['text','Text'],['coding','Coding'],['hard','Hard prompts'],\n              ['vision','Vision'],['search','Search'],['document','Document']];\nconst ARENA_BOARD=Object.fromEntries(BOARDS.map(([b,l])=>[b,'Arena '+l]));\nconst ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');\n// Rating only, so the column stays right-aligned. Arena's rank band\n// (rankUpper..rankLower) becomes one visual state: green = the votes can't\n// separate this model from #1. The full band is spelled out in the tooltip.\nfunction arenaCell(d,b){const a=(d.arena||{})[b];\n  if(!a) return `\u003cspan class=\"up\" title=\"Not yet rated on the ${ARENA_BOARD[b]} leaderboard\">\u00b7\u003c/span>`;\n  const top=a.hi===1;\n  const where=a.hi===a.lo?`Ranked ${ord(a.hi)}.`\n    :`Could rank anywhere from ${ord(a.hi)} to ${ord(a.lo)}: the votes can't separate it from the models in that range.`;\n  const t=`${ARENA_BOARD[b]} rating ${a.r} (\u00b1${a.ci}). ${where}${top?' Statistically tied for first.':''} `+\n          `${fmt(a.v)} votes. Rated variant: ${a.n}.`;\n  return `\u003cspan class=\"${top?'tie1':''}\" title=\"${escA(t)}\">${a.r}\u003c/span>`;}\n\n/* ---------- model card ----------\n   One card per model, shared by table rows and chart dots. Hover shows it\n   (hidden after 150 ms so the pointer can travel into it), click or tap pins\n   it, Esc or a click elsewhere unpins. #m=\u003cslug> opens one pinned on load. */\nconst EFFORT_ORDER=['max','xhigh','high','medium','low','minimal'];\nconst MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst baseName=n=>shortName(n).replace(/\\s*\\([^)]*\\)\\s*$/,'').trim();\nconst effortOf=n=>{const m=shortName(n).match(/\\(([^)]*)\\)\\s*$/);return m?m[1]:'\u2014';};\n// Family = same lab + same name once the trailing effort parenthetical is gone.\n// Built from DATA (every model), so the ladder includes variants under the cutoff.\nconst famKey=d=>(d.creator||'')+'|'+baseName(d.name);\nconst FAM={}, BYSLUG={};\nDATA.forEach(d=>{const k=famKey(d);(FAM[k]=FAM[k]||[]).push(d);\n  if(d.slug) BYSLUG[d.slug]=d;});\nconst famOf=d=>FAM[famKey(d)]||[d];\n// Ladder order: max \u2192 minimal, unknown efforts last. Shared by the card and the table.\nconst effortRank=x=>{const i=EFFORT_ORDER.indexOf(effortOf(x.name).toLowerCase());return i\u003c0?99:i;};\nfunction rankWords(a){\n  if(a.hi===1&&a.lo===1) return '\u003cspan class=\"tie1\">1st\u003c/span>';\n  if(a.hi===1) return '\u003cspan class=\"tie1\">tied for 1st\u003c/span>';\n  if(a.hi===a.lo) return ord(a.hi);\n  return `could be ${ord(a.hi)}\u2013${ord(a.lo)}`;}\nfunction monthYear(iso){const m=/^(\\d{4})-(\\d{2})/.exec(iso||'');return m?MON[+m[2]-1]+' '+m[1]:null;}\nfunction releasedText(iso){\n  const t=new Date((iso||'')+'T00:00:00'); if(isNaN(t)) return null;\n  const days=Math.max(0,Math.round((Date.now()-t)/864e5));\n  const yr=t.getFullYear()!==new Date().getFullYear()?' '+t.getFullYear():'';\n  return `Released ${MON[t.getMonth()]} ${t.getDate()}${yr} \u00b7 ${days===0?'today':days===1?'1 day ago':days+' days ago'}`;}\nfunction cardHtml(d){\n  let h=`\u003cdiv class=\"mc-h\">\u003cb>${escA(shortName(d.name))}\u003c/b>${d.china?'\u003cspan class=\"tag cn\">CN\u003c/span>':''}\u003c/div>`;\n  h+=`\u003cdiv class=\"mc-sub\">${escA([d.creator,d.open?'open weights':'closed'].filter(Boolean).join(' \u00b7 '))}\u003c/div>`;\n  const f=[], rel=releasedText(d.release), kc=monthYear(d.kcut);\n  if(rel) f.push(rel);\n  if(kc) f.push('knowledge to '+kc);\n  if(d.ctx) f.push(ctxf(d.ctx)+' context');\n  if(d.params!=null) f.push(d.params+'B params');\n  if(f.length) h+=`\u003cdiv class=\"mc-facts\">${escA(f.join(' \u00b7 '))}\u003c/div>`;\n  const ar=d.arena||{}, rated=BOARDS.filter(([b])=>ar[b]), un=BOARDS.filter(([b])=>!ar[b]);\n  h+=`\u003cdiv class=\"mc-sec\">Arena \u2014 where people prefer it\u003c/div>`;\n  if(!rated.length) h+=`\u003cdiv class=\"mc-muted\">Not yet rated on Arena\u003c/div>`;\n  else {\n    h+='\u003ctable class=\"mc-t\">'+rated.map(([b,l])=>{const a=ar[b];\n      return `\u003ctr>\u003ctd class=\"l\">${l}\u003c/td>\u003ctd>${a.r}\u003c/td>\u003ctd class=\"w\">${rankWords(a)}\u003c/td>\u003c/tr>`;}).join('')+'\u003c/table>';\n    if(un.length) h+=`\u003cdiv class=\"mc-muted\">Not rated: ${un.map(x=>x[1]).join(', ')}\u003c/div>`;\n  }\n  const fam=famOf(d);\n  if(fam.length>=2){\n    let rows=[...fam].sort((a,b)=>effortRank(a)-effortRank(b)||(b.intel||0)-(a.intel||0));\n    if(rows.length>8){const cur=rows.find(x=>x.slug===d.slug); rows=rows.slice(0,8);\n      if(cur&&!rows.includes(cur)) rows[7]=cur;}\n    const tt=x=>x.ttft==null?'\u00b7':fmt(x.ttft,x.ttft\u003c10?1:0)+'s';\n    h+=`\u003cdiv class=\"mc-sec\">Effort levels\u003c/div>\u003ctable class=\"mc-t\">`+\n       `\u003ctr class=\"hd\">\u003ctd class=\"l\">\u003c/td>\u003ctd>Intel\u003c/td>\u003ctd>Blended\u003c/td>\u003ctd>First token\u003c/td>\u003c/tr>`+\n       rows.map(x=>`\u003ctr class=\"${x.slug===d.slug?'cur':''}\">\u003ctd class=\"l\">${escA(effortOf(x.name))}\u003c/td>`+\n         `\u003ctd>${fmt(x.intel,1)}\u003c/td>\u003ctd>${money(x.blended)}\u003c/td>\u003ctd>${tt(x)}\u003c/td>\u003c/tr>`).join('')+'\u003c/table>';\n  }\n  h+=`\u003cdiv class=\"mc-links\">\u003ca class=\"mlink-chip aa\" href=\"https://artificialanalysis.ai/models/${encodeURIComponent(d.slug||'')}\" target=\"_blank\" rel=\"noopener\">${AA_ICON}AA\u003c/a>`+\n     (d.or_id?`\u003ca class=\"mlink-chip or\" href=\"https://openrouter.ai/${escA(d.or_id)}\" target=\"_blank\" rel=\"noopener\">${OR_ICON}OpenRouter\u003c/a>`:'')+\n     `\u003ca class=\"mlink-chip ar\" href=\"https://arena.ai/leaderboard/text\" target=\"_blank\" rel=\"noopener\">${OR_ICON}Arena\u003c/a>\u003c/div>`;\n  return h;}\n\nconst CARD=document.createElement('div'); CARD.className='mcard'; document.body.appendChild(CARD);\nlet cardFor=null, cardAnchor=null, pinned=false, cardHideT=null;\nfunction placeCard(a){\n  if(!a||!a.isConnected){ unpinCard(); return; }   // anchor row was re-rendered away\n  const r=a.getBoundingClientRect(), vw=innerWidth, vh=innerHeight, cw=CARD.offsetWidth, ch=CARD.offsetHeight;\n  let x=r.right+10, y=r.top-8;\n  if(x+cw>vw-8) x=r.left-cw-10;          // flip left\n  if(x\u003c8) x=Math.max(8,Math.min(vw-cw-8,r.left)), y=r.bottom+8;   // no room either side: go below\n  if(y+ch>vh-8) y=vh-ch-8;               // flip up\n  CARD.style.left=Math.max(8,x)+'px'; CARD.style.top=Math.max(8,y)+'px';}\nfunction openCard(d,a){ if(!cardFor||cardFor.slug!==d.slug){CARD.innerHTML=cardHtml(d);}\n  cardFor=d; cardAnchor=a; CARD.classList.add('on'); placeCard(a);}\nfunction showCard(d,a){ if(pinned) return; clearTimeout(cardHideT); openCard(d,a);}\nfunction hideCardSoon(){ if(pinned) return; clearTimeout(cardHideT);\n  cardHideT=setTimeout(()=>{CARD.classList.remove('on'); cardFor=cardAnchor=null;},150);}\n// On the live site this page is a srcdoc iframe; the address bar belongs to the\n// parent (same origin), so #m= deep links are read from and written to it.\nconst HWIN=(()=>{try{ if(window.parent!==window){ void window.parent.location.href; return window.parent;} }catch(e){} return window;})();\nfunction setHash(slug){ try{ const u=HWIN.location.pathname+HWIN.location.search+(slug?'#m='+encodeURIComponent(slug):'');\n  HWIN.history.replaceState(null,'',u);}catch(e){} }\nfunction pinCard(d,a){ clearTimeout(cardHideT); pinned=true; CARD.classList.add('pinned'); openCard(d,a); setHash(d.slug);}\nfunction unpinCard(){ const was=pinned; pinned=false; CARD.classList.remove('pinned','on'); cardFor=cardAnchor=null; if(was) setHash(null);}\nfunction togglePin(d,a){ if(pinned&&cardFor&&cardFor.slug===d.slug) unpinCard(); else { pinned=false; pinCard(d,a);} }\nCARD.addEventListener('mouseenter',()=>clearTimeout(cardHideT));\nCARD.addEventListener('mouseleave',hideCardSoon);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape') unpinCard();});\ndocument.addEventListener('click',e=>{ if(pinned&&!CARD.contains(e.target)&&!e.target.closest('[data-card]')) unpinCard();});\naddEventListener('scroll',()=>{ if(!CARD.classList.contains('on')||!cardAnchor) return;\n  if(pinned) placeCard(cardAnchor); else {CARD.classList.remove('on'); cardFor=cardAnchor=null;} },{passive:true});\nfunction openFromHash(){\n  const m=/^#m=(.+)$/.exec(HWIN.location.hash); if(!m) return;\n  const slug=decodeURIComponent(m[1]), d=BYSLUG[slug]; if(!d) return;\n  if(st1.reveal) st1.reveal(slug);   // a non-strongest variant lives in a sub-row: expand its family first\n  const q=`tr[data-key=\"${CSS.escape(slug.replace(/\"/g,''))}\"] .modelcell`;\n  const cell=document.querySelector('#t1 '+q)||document.querySelector('#t2 '+q);\n  if(cell){ cell.closest('tr').scrollIntoView({block:'center'}); pinned=false; pinCard(d,cell);} }\n\nconst TODAY_MS=Date.now(),ONE_YEAR_MS=365*24*3600*1000;\nconst gfState={small:true,old:true,low:true};\nfunction gfMatch(d){\n  if(gfState.small && d.params!=null && d.params\u003c12) return false;\n  if(gfState.old && d.release){if(TODAY_MS-new Date(d.release).getTime()>ONE_YEAR_MS) return false;}\n  if(gfState.low && d.intel!=null && d.intel\u003c20) return false;\n  return true;\n}\n// With state.group, rows collapse into families (same lab + base name): the\n// family row carries its strongest variant (highest intel) in every column, and\n// the other effort settings hang under it as sub-rows, in ladder order, when the\n// family is expanded. Sorting, search and filters act on the family through its\n// members; expanded families survive re-render. Without state.group every row\n// is its own one-member group, so both tables share one render path.\n// Family head = strongest variant (highest intel). AA scores the strongest\n// setting last, so a family row can be blank where a lower setting already\n// has a number. fillHead fills each blank column from the first sub-row\n// (ladder order) that has it. disp = head with the borrowed values, used for\n// display and sorting; bor = column key -> source effort label. Intel and the\n// name are the family's own by construction and never borrowed. Shared by\n// makeTable's family grouping and the Best-for grid's famGroups below.\nconst headOf=ms=>ms.reduce((a,b)=>(b.intel||0)>(a.intel||0)?b:a);\nfunction fillHead(head,subs,cols){\n  const disp={...head}, bor={};\n  if(!subs.length) return {disp,bor};\n  cols.forEach(c=>{const k=c.k; if(k==='name'||k==='intel'||head[k]!=null) return;\n    const src=subs.find(s=>s[k]!=null); if(!src) return;\n    disp[k]=src[k]; bor[k]=effortOf(src.name);\n    // Arena columns render from d.arena.\u003cboard>, not from the sort key.\n    if(k.startsWith('ar_')){const b=k.slice(3); disp.arena={...(head.arena||{}),[b]:(src.arena||{})[b]};}});\n  return {disp,bor};}\n// One row per family (famKey), head-filled from its sub-rows. Used by the\n// Best-for grid, which \u2014 unlike makeTable \u2014 always shows every family with\n// no search/filter/expand state.\nfunction famGroups(rows,cols){\n  const groups=new Map();\n  rows.forEach(d=>{const k=famKey(d); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(d);});\n  const fams=[];\n  groups.forEach((ms,k)=>{\n    const head=headOf(ms);\n    const subs=ms.filter(d=>d!==head).sort((a,b)=>effortRank(a)-effortRank(b)||(b.intel||0)-(a.intel||0));\n    const {disp,bor}=fillHead(head,subs,cols);\n    fams.push({k,head,disp,bor,subs});});\n  return fams;\n}\n\nfunction makeTable(elId,rows,state){\n  const el=document.getElementById(elId);\n  const mx={intel:maxOf(rows,'intel'),ipd:maxOf(rows,'ipd')};\n  const expanded=new Set();\n  const groups=new Map();\n  rows.forEach((d,i)=>{const k=state.group?famKey(d):i; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(d);});\n  function nameCell(e){\n    if(!state.group) return modelCell(e.d);\n    if(e.sub) return `\u003cspan class=\"exp\">\u003c/span>${modelCell(e.d,effortOf(e.d.name))}`;\n    const n=1+e.fam.subs.length;\n    if(n===1) return `\u003cspan class=\"exp\">\u003c/span>${modelCell(e.d)}`;\n    return `\u003cspan class=\"exp\" data-fam=\"${escA(e.fam.k)}\" title=\"${e.fam.open?'Hide':'Show'} effort settings\">${e.fam.open?'\u25be':'\u25b8'}\u003c/span>`+\n      modelCell(e.d,baseName(e.d.name),`\u003cspan class=\"nset\">${n} settings\u003c/span>`);}\n  function render(){\n    const q=state.q.toLowerCase();\n    const pass=d=>state.filter(d)&&gfMatch(d);\n    const hit=d=>!q||(d.name+' '+(d.creator||'')).toLowerCase().includes(q);\n    const fams=[];\n    groups.forEach((ms,k)=>{const vis=ms.filter(pass); if(!vis.length||!vis.some(hit)) return;\n      const head=headOf(vis);\n      const subs=vis.filter(d=>d!==head).sort((a,b)=>effortRank(a)-effortRank(b)||(b.intel||0)-(a.intel||0));\n      // A search that matches only a sub-row's variant shows the family opened.\n      const {disp,bor}=fillHead(head,subs,state.cols);\n      fams.push({k,head,disp,bor,subs,open:expanded.has(k)||!hit(head)});});\n    // Sort on the displayed value so a family never sinks for a number it shows.\n    if(state.sort){const {k,dir}=state.sort;\n      fams.sort((a,b)=>{let x=a.disp[k],y=b.disp[k];\n        if(typeof x==='string'||typeof y==='string'){x=(x||'');y=(y||'');return dir*((x>y)-(x\u003cy));}\n        x=(x==null?-Infinity:x);y=(y==null?-Infinity:y);return dir*(x-y);});}\n    const view=[];\n    fams.forEach(f=>{view.push({d:f.head,disp:f.disp,bor:f.bor,fam:f}); if(f.open) f.subs.forEach(d=>view.push({d,sub:true}));});\n    let h='\u003cthead>\u003ctr>'+state.cols.map(c=>{const ar=state.sort&&state.sort.k===c.k?(state.sort.dir>0?' \u2191':' \u2193'):'';\n      return `\u003cth class=\"${c.l?'l':''}\" data-k=\"${c.k}\">${c.t}\u003cspan class=\"arrow\">${ar}\u003c/span>\u003c/th>`;}).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n    h+=view.map(e=>{const d=e.d, v=e.disp||d, bor=e.bor||{};\n      return `\u003ctr class=\"${e.sub?'sub':''}\" data-key=\"${(d.slug||'').replace(/\"/g,'')}\">`+state.cols.map(c=>{let inner=c.k==='name'?nameCell(e):c.r(v);\n        if(bor[c.k]) inner=`\u003cspan class=\"borrowed\" title=\"${escA(`from the ${bor[c.k]} setting \u2014 AA hasn't scored ${effortOf(d.name).replace('\u2014','this setting')} on this yet`)}\">${inner}\u003c/span>`;\n        if(c.bar){const w=Math.max(0,((v[c.bar]||0)/mx[c.bar])*100);\n          inner=`\u003cspan class=\"bar\">\u003cspan style=\"width:${w}%\">\u003c/span>\u003cem>${inner}\u003c/em>\u003c/span>`;}\n        return `\u003ctd class=\"${c.l?'l':''}\">${inner}\u003c/td>`;}).join('')+'\u003c/tr>';}).join('');\n    h+='\u003c/tbody>';\n    el.innerHTML=h;\n    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;\n      state.sort=(state.sort&&state.sort.k===k)?{k,dir:-state.sort.dir}:{k,dir:-1};render();});\n    el.querySelectorAll('.exp[data-fam]').forEach(x=>x.onclick=()=>{const k=x.dataset.fam;\n      if(expanded.has(k)) expanded.delete(k); else expanded.add(k); render();});\n    el.querySelectorAll('tbody tr').forEach((tr,i)=>{\n      const d=view[i].d, cell=tr.querySelector('.modelcell');\n      if(cell){ cell.dataset.card='1';\n        cell.onmouseenter=()=>showCard(d,cell);\n        cell.onmouseleave=hideCardSoon;\n        cell.onclick=e=>{e.stopPropagation(); togglePin(d,cell);}; }\n      tr.onmouseenter=()=>window.HI&&window.HI(tr.dataset.key);\n      tr.onmouseleave=()=>window.UN&&window.UN(tr.dataset.key);});\n    if(state.cnt){const n=fams.length, t=fams.reduce((s,f)=>s+1+f.subs.length,0);\n      document.getElementById(state.cnt).textContent=state.group?`${n} models \u00b7 ${t} settings`:n+' models';}\n  }\n  // Expand the family whose non-strongest member has this slug (used by #m=\u003cslug>).\n  state.reveal=slug=>{ if(!state.group) return;\n    groups.forEach((ms,k)=>{ if(ms.length>1&&!expanded.has(k)&&ms.some(d=>d.slug===slug)&&headOf(ms).slug!==slug){expanded.add(k); render();}});};\n  state.render=render; render();\n}\n\nconst st1={sort:{k:'intel',dir:-1},q:'',filter:()=>true,cnt:'c1',cols:COLS_FRONTIER,group:true};\nmakeTable('t1',OVERALL,st1);\ndocument.getElementById('s1').oninput=e=>{st1.q=e.target.value;st1.render();};\n\n/* ---------- Best for\u2026 : one row per Frontier family, one column per job ---------- */\n(function(){\n  const cols=[{k:'name',t:'Model',l:1},\n    ...BOARDS.filter(([b])=>b!=='search').map(([b,l])=>({k:'ar_'+b,t:l})),\n    {k:'coding',t:'AA Code'},{k:'agent',t:'AA Agent'}];\n  const fams=famGroups(OVERALL,cols);\n  const rawVal=(f,k)=>{ if(k.startsWith('ar_')){const a=(f.disp.arena||{})[k.slice(3)]; return a?a.r:null;}\n    return f.disp[k]; };\n  // Single-hue sequential shade of --good, ranked within the column among the\n  // rows shown (ties share a shade); the number itself still carries the value.\n  const SHADES=['rgba(116,201,124,.42)','rgba(116,201,124,.32)','rgba(116,201,124,.23)',\n                'rgba(116,201,124,.15)','rgba(116,201,124,.08)'];\n  const shadeFns={};\n  cols.slice(1).forEach(c=>{\n    const vals=[...new Set(fams.map(f=>rawVal(f,c.k)).filter(v=>v!=null))].sort((a,b)=>b-a);\n    shadeFns[c.k]=v=>{ if(v==null||!vals.length) return null;\n      const tier=Math.min(4,Math.floor(vals.indexOf(v)*5/vals.length));\n      return SHADES[tier]; };\n  });\n  // Winners strip: the family (or families) at rank 1 per job. Arena ties are\n  // the board's own statistical tie (hi===1); AA has no rank band, so its tie\n  // is exact value equality.\n  function winnersFor(c){\n    const scored=fams.filter(f=>rawVal(f,c.k)!=null);\n    if(!scored.length) return null;\n    if(c.k.startsWith('ar_')){\n      const b=c.k.slice(3);\n      return scored.filter(f=>f.disp.arena[b].hi===1);\n    }\n    const max=Math.max(...scored.map(f=>rawVal(f,c.k)));\n    return scored.filter(f=>rawVal(f,c.k)===max);\n  }\n  let strip='';\n  cols.slice(1).forEach(c=>{\n    const w=winnersFor(c); if(!w) return;\n    const names=w.map(f=>baseName(f.head.name));\n    const tie=w.length>1?`\u003cspan class=\"bf-n\">${w.length}-way tie\u003c/span>`:'';\n    strip+=`\u003cspan class=\"bf-item\">\u003cspan class=\"bf-job\">${escA(c.t)}${tie}\u003c/span>`+\n      `\u003cspan class=\"bf-winner\">${names.map(n=>`\u003cspan class=\"bf-nm\">${escA(n)}\u003c/span>`).join(' \u00b7 ')}\u003c/span>\u003c/span>`;\n  });\n  document.getElementById('bfstrip').innerHTML=strip;\n  // Grid: default sort = Intel desc (Intel isn't a shown column here).\n  let sort={k:null,dir:1};\n  function cellHtml(f,c){\n    if(c.k==='name') return `\u003ctd class=\"l\">\u003cspan class=\"modelcell\" data-card=\"1\">${escA(baseName(f.head.name))}\u003c/span>\u003c/td>`;\n    const isArena=c.k.startsWith('ar_'), b=isArena?c.k.slice(3):null;\n    const a=isArena?(f.disp.arena||{})[b]:null;\n    const v=isArena?(a?a.r:null):f.disp[c.k];\n    if(v==null) return `\u003ctd title=\"Not yet rated\">\u003c/td>`;\n    const style=shadeFns[c.k](v)?` style=\"background:${shadeFns[c.k](v)}\"`:'';\n    let title,tie=false;\n    if(isArena){\n      tie=a.hi===1;\n      title=`${ARENA_BOARD[b]}. Rating ${a.r}, ${rankWords(a).replace(/\u003c[^>]+>/g,'')}. Rated variant: ${a.n}.`;\n    } else {\n      title=`${c.t} index ${fmt(v,1)}. Variant rated: ${f.bor[c.k]||effortOf(f.head.name)}.`;\n    }\n    return `\u003ctd${style} title=\"${escA(title)}\">\u003cspan class=\"${tie?'tie1':''}\">${isArena?a.r:fmt(v,1)}\u003c/span>\u003c/td>`;\n  }\n  function render(){\n    const el=document.getElementById('tbf');\n    const arr=[...fams].sort((x,y)=>{\n      if(!sort.k) return (y.head.intel||0)-(x.head.intel||0);\n      const a=rawVal(x,sort.k), b=rawVal(y,sort.k);\n      if(a==null&&b==null) return 0;\n      if(a==null) return 1; if(b==null) return -1;\n      return sort.dir===1?b-a:a-b;\n    });\n    let h='\u003cthead>\u003ctr>'+cols.map(c=>{const ar=sort.k===c.k?(sort.dir===1?' \u2193':' \u2191'):'';\n      return `\u003cth class=\"${c.l?'l':''}\" data-k=\"${c.k}\">${escA(c.t)}\u003cspan class=\"arrow\">${ar}\u003c/span>\u003c/th>`;}).join('')+\n      '\u003c/tr>\u003c/thead>\u003ctbody>';\n    h+=arr.map(f=>`\u003ctr data-key=\"${(f.head.slug||'').replace(/\"/g,'')}\">`+\n      cols.map(c=>cellHtml(f,c)).join('')+'\u003c/tr>').join('');\n    h+='\u003c/tbody>';\n    el.innerHTML=h;\n    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{\n      const k=th.dataset.k; if(k==='name') return;\n      sort=(sort.k===k)?{k,dir:-sort.dir}:{k,dir:1};\n      render();});\n    el.querySelectorAll('tbody tr').forEach((tr,i)=>{\n      const f=arr[i], cell=tr.querySelector('.modelcell');\n      if(cell){ cell.onmouseenter=()=>showCard(f.head,cell);\n        cell.onmouseleave=hideCardSoon;\n        cell.onclick=e=>{e.stopPropagation(); togglePin(f.head,cell);}; }\n      tr.onmouseenter=()=>window.HI&&window.HI(tr.dataset.key);\n      tr.onmouseleave=()=>window.UN&&window.UN(tr.dataset.key);});\n  }\n  render();\n})();\n\nconst CNOSS=DATA.filter(d=>d.china||d.open).filter(d=>d.intel!=null).sort((a,b)=>b.intel-a.intel);\nconst st2={sort:{k:'intel',dir:-1},q:'',filter:()=>true,cnt:'c2',cols:COLS_OSS};\nmakeTable('t2',CNOSS,st2);\nopenFromHash(); HWIN.addEventListener('hashchange',openFromHash);\ndocument.getElementById('s2').oninput=e=>{st2.q=e.target.value;st2.render();};\ndocument.querySelectorAll('[data-f]').forEach(ch=>ch.onclick=()=>{\n  document.querySelectorAll('[data-f]').forEach(c=>c.classList.remove('on'));ch.classList.add('on');\n  const f=ch.dataset.f;\n  st2.filter = f==='china'?(d=>d.china) : f==='open'?(d=>d.open) : (()=>true);\n  st2.render();});\ndocument.querySelectorAll('[data-gf]').forEach(ch=>ch.onclick=()=>{\n  const f=ch.dataset.gf; gfState[f]=!gfState[f];\n  ch.classList.toggle('on',gfState[f]);\n  st1.render(); st2.render();});\n\u003c/script>\n\u003c/body>\u003c/html>"</script>
<script id="d-apps" type="application/json">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>OpenRouter App Intelligence \u00b7 September 2026\u003c/title>\n\u003cstyle>\n  :root {\n    --bg:#09090b; --surface:#111113; --surface2:#1a1a1e; --border:#27272a;\n    --text:#fafafa; --muted:#71717a; --accent:#7c3aed;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}\n  header{border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;\n    justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}\n  header h1{font-size:18px;font-weight:600;letter-spacing:-.02em}\n  header h1 span{color:var(--muted);font-weight:400}\n  .pill{background:var(--surface2);border:1px solid var(--border);border-radius:6px;\n    padding:5px 13px;font-size:14px;color:var(--muted)}\n  .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 61px)}\n  aside{border-right:1px solid var(--border);padding:16px 0;position:sticky;\n    top:61px;height:calc(100vh - 61px);overflow-y:auto}\n  .sidebar-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;\n    color:var(--muted);padding:0 16px 8px}\n  .app-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;\n    transition:background .15s;border-left:2px solid transparent}\n  .app-item:hover{background:var(--surface)}\n  .app-item.active{background:var(--surface);border-left-color:var(--accent)}\n  .app-item.overview-item{border-bottom:1px solid var(--border);margin-bottom:8px;padding-bottom:14px}\n  .rank-badge{width:22px;height:22px;border-radius:50%;background:var(--surface2);\n    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;\n    font-size:12px;color:var(--muted);flex-shrink:0}\n  .rank-badge.r1{background:#7c3aed22;border-color:#7c3aed66;color:#a78bfa}\n  .app-name{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;\n    overflow:hidden;text-overflow:ellipsis}\n  .app-tokens{font-size:13.5px;color:var(--muted);flex-shrink:0}\n  .trend{font-size:13px;padding:2px 7px;border-radius:4px;flex-shrink:0}\n  .trend.up{background:#16a34a22;color:#4ade80}\n  .trend.down{background:#dc262622;color:#f87171}\n  .stale{font-size:12px;color:#fbbf24;background:#78350f33;border:1px solid #92400e66;\n    border-radius:4px;padding:2px 8px;display:inline-block;margin-top:8px}\n  main{padding:28px 32px;overflow-y:auto}\n  .insights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}\n  .insight-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}\n  .insight-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;\n    color:var(--muted);margin-bottom:6px}\n  .insight-card .value{font-size:22px;font-weight:700;letter-spacing:-.03em}\n  .insight-card .sub{font-size:14px;color:var(--muted);margin-top:3px}\n  .heatmap-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;overflow-x:auto}\n  .heatmap-wrap h2{font-size:14px;font-weight:600;margin-bottom:4px}\n  .heatmap-wrap .desc{font-size:14px;color:var(--muted);margin-bottom:16px}\n  table.heatmap{border-collapse:collapse;font-size:13px;min-width:100%}\n  table.heatmap th{color:var(--muted);font-weight:500;padding:4px 8px;text-align:center;white-space:nowrap}\n  table.heatmap th.model-col{text-align:left;min-width:160px}\n  table.heatmap td{padding:4px 8px;text-align:center}\n  table.heatmap td.model-name{text-align:left;color:var(--text);font-weight:500}\n  table.heatmap td.model-name .cdot{display:inline-block;width:7px;height:7px;\n    border-radius:50%;margin-right:6px;vertical-align:middle}\n  .heat-cell{display:inline-block;width:32px;height:22px;border-radius:4px;line-height:22px;\n    font-size:12px;color:white;font-weight:600;text-align:center}\n  .heat-0{background:var(--surface2)} .heat-1{background:#4a9eff33;color:#4a9eff}\n  .heat-2{background:#4a9eff66} .heat-3{background:#4a9eff99}\n  .heat-4{background:#4a9effcc} .heat-5{background:#4a9eff}\n  table.heatmap th.total-col,table.heatmap td.model-total{border-left:1px solid var(--border);font-weight:700;color:var(--text)}\n  table.heatmap tr.totals-row td{border-top:2px solid var(--border);font-weight:700;color:var(--muted);padding-top:8px}\n  table.heatmap tr.totals-row td.grand{color:var(--text)}\n  .app-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px}\n  .app-title{font-size:24px;font-weight:700;letter-spacing:-.03em}\n  .app-desc{font-size:14px;color:var(--muted);margin-top:5px;max-width:640px;line-height:1.5}\n  .stats-row{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}\n  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:110px}\n  .stat-box .s-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}\n  .stat-box .s-value{font-size:18px;font-weight:700;letter-spacing:-.02em}\n  .stat-box .s-value.rank{color:#a78bfa}\n  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}\n  .chart-wrap h2{font-size:14px;font-weight:600;margin-bottom:4px}\n  .chart-wrap .desc{font-size:14px;color:var(--muted);margin-bottom:20px}\n  .bar-list{display:flex;flex-direction:column;gap:6px}\n  .bar-row{display:grid;grid-template-columns:180px 1fr 80px;align-items:center;gap:10px}\n  .bar-label{font-size:14px;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .bar-track{background:var(--surface2);border-radius:3px;height:22px;overflow:hidden;position:relative}\n  .bar-fill{height:100%;border-radius:3px;transition:width .4s ease;display:flex;align-items:center;padding-left:8px}\n  .bar-fill-label{font-size:12.5px;color:rgba(255,255,255,.9);font-weight:600;white-space:nowrap}\n  .bar-value{font-size:13.5px;color:var(--muted);text-align:right}\n  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}\n  .legend-item{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}\n  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}\n  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}\n  .tag{font-size:13px;padding:3px 9px;border-radius:4px;background:var(--surface2);\n    border:1px solid var(--border);color:var(--muted)}\n  .section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}\n  .no-data{color:var(--muted);font-size:14px;padding:20px 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003ch1>OpenRouter App Intelligence \u003cspan>\u00b7 September 2026\u003c/span>\u003c/h1>\n  \u003cdiv style=\"display:flex;gap:8px\">\n    \u003cspan class=\"pill\">Top 10 Apps\u003c/span>\n    \u003cspan class=\"pill\">Model Usage \u00b7 This Month\u003c/span>\n    \u003cspan class=\"pill\">Generated 2026-09-22 20:28\u003c/span>\n  \u003c/div>\n\u003c/header>\n\u003cdiv class=\"layout\">\n  \u003caside>\n    \u003cdiv class=\"sidebar-label\">View\u003c/div>\n    \u003cdiv class=\"app-item overview-item active\" onclick=\"showOverview(this)\">\n      \u003cdiv class=\"rank-badge\">\u224b\u003c/div>\n      \u003cdiv class=\"app-name\">Cross-App Overview\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sidebar-label\">Top Apps\u003c/div>\n    \u003cdiv id=\"app-list\">\u003c/div>\n  \u003c/aside>\n  \u003cmain id=\"main-panel\">\u003c/main>\n\u003c/div>\n\u003cscript>\nconst CREATORS = {\n  anthropic:'#ff6b4a', deepseek:'#4a9eff', openrouter:'#8b5cf6',\n  google:'#34d399', minimax:'#f59e0b', nvidia:'#76b900',\n  stepfun:'#ec4899', poolside:'#06b6d4', openai:'#10b981',\n  'z h(m=>{\n      if(!modelMap[m.name]) modelMap[m.name]={creator:m.creator,apps:new Array(APPS.length).fill(0),count:0};\n      modelMap[m.name].apps[ai]=m.tokens;\n      modelMap[m.name].count++;\n    });\n  });\n  return {modelMap,appNames:names};\n}\n\nfunction setActive(el) {\n  document.querySelectorAll('.app-item').forEach(e=>e.classList.remove('active'));\n  el.classList.add('active');\n}\n\nfunction renderSidebar() {\n  const list=document.getElementById('app-list');\n  APPS.forEach((app,i)=>{\n    const el=document.createElement('div');\n    el.className='app-item'; el.dataset.slug=app.slug;\n    el.innerHTML=`\n      \u003cdiv class=\"rank-badge ${i===0?'r1':''}\">${app.rank}\u003c/div>\n      \u003cdiv class=\"app-name\">${app.name}\u003c/div>\n      ${app.trend?`\u003cdiv class=\"trend ${app.trend.startsWith('-')?'down':'up'}\">${app.trend}\u003c/div>`:''}\n      \u003cdiv class=\"app-tokens\">${app.todayTokens||''}\u003c/div>`;\n    el.onclick=()=>showApp(app,el);\n    list.appendChild(el);\n  });\n}\n\nfunction showOverview(el) {\n  setActive(el);\n  const {modelMap,appNames}=buildCross();\n  const sorted=Object.entries(modelMap).sort((a,b)=>\n    b[1].count-a[1].count||(b[1].apps.reduce((s,v)=>s+v,0)-a[1].apps.reduce((s,v)=>s+v,0)));\n  const top15=sorted.slice(0,15);\n  const appTotals=APPS.map(app=>(app.models||[]).reduce((s,m)=>s+m.tokens,0));\n  const grandTotal=appTotals.reduce((s,v)=>s+v,0);\n  const creatorTotals={};\n  APPS.forEach(app=>(app.models||[]).forEach(m=>{\n    creatorTotals[m.creator]=(creatorTotals[m.creator]||0)+m.tokens;\n  }));\n  const allTok=Object.values(creatorTotals).reduce((s,v)=>s+v,0);\n  const topC=Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1])[0]||['?',0];\n  const topCpct=allTok?Math.round(topC[1]/allTok*100):0;\n  const mu=sorted[0]||['?',{count:0}];\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"section-title\">Cross-App Insights\u003c/div>\n    \u003cdiv class=\"insights-grid\">\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Most Universal Model\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:15px;color:#4a9eff\">${mu[0]}\u003c/div>\n        \u003cdiv class=\"sub\">In ${mu[1].count}/${APPS.length} apps with model data\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Dominant Creator\u003c/div>\n        \u003cdiv class=\"value\" style=\"font-size:18px;color:${CREATORS[topC[0]]||'#fff'}\">${topC[0][0]?.toUpperCase()+topC[0].slice(1)}\u003c/div>\n        \u003cdiv class=\"sub\">${topCpct}% of cross-app token volume\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"insight-card\">\n        \u003cdiv class=\"label\">Total Token Volume\u003c/div>\n        \u003cdiv class=\"value\">${fmtT(Math.round(allTok))}\u003c/div>\n        \u003cdiv class=\"sub\">Across top ${APPS.length} apps this month\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"heatmap-wrap\">\n      \u003ch2>Model \u00d7 App Heatmap\u003c/h2>\n      \u003cp class=\"desc\">Top 15 models by breadth. Cell shading = token volume relative to that model's biggest app (row-normalized). Total column = model's tokens across these apps; App total row = each app's tokens across all its models.\u003c/p>\n      \u003ctable class=\"heatmap\">\n        \u003cthead>\u003ctr>\n          \u003cth class=\"model-col\">Model\u003c/th>\u003cth>Creator\u003c/th>\u003cth>Apps\u003c/th>\n          ${appNames.map(n=>`\u003cth>${n}\u003c/th>`).join('')}\u003cth class=\"total-col\">Total\u003c/th>\n        \u003c/tr>\u003c/thead>\n        \u003ctbody>\n          ${top15.map(([name,data])=>{\n            const maxT=Math.max(...data.apps)||1;\n            return `\u003ctr>\n              \u003ctd class=\"model-name\">\u003cspan class=\"cdot\" style=\"background:${CREATORS[data.creator]||'#555'}\">\u003c/span>${name}\u003c/td>\n              \u003ctd style=\"color:${CREATORS[data.creator]||'#999'};font-size:13px\">${data.creator}\u003c/td>\n              \u003ctd style=\"color:#a78bfa;font-weight:700\">${data.count}\u003c/td>\n              ${data.apps.map(t=>{\n                if(!t) return `\u003ctd>\u003cspan class=\"heat-cell heat-0\">\u2013\u003c/span>\u003c/td>`;\n                const lv=Math.min(5,Math.ceil((t/maxT)*5));\n                const lb=t>=1000?(t/1000).toFixed(1)+'T':Math.round(t)+'B';\n                return `\u003ctd title=\"${lb}\">\u003cspan class=\"heat-cell heat-${lv}\">${lb.replace('B','')}\u003c/span>\u003c/td>`;\n              }).join('')}\n              \u003ctd class=\"model-total\">${fmtT(Math.round(data.apps.reduce((s,v)=>s+v,0)))}\u003c/td>\n            \u003c/tr>`;\n          }).join('')}\n          \u003ctr class=\"totals-row\">\n            \u003ctd class=\"model-name\">App total\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\n            ${appTotals.map(t=>`\u003ctd>${fmtT(Math.round(t))}\u003c/td>`).join('')}\n            \u003ctd class=\"grand\">${fmtT(Math.round(grandTotal))}\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cdiv style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n        ${appNames.map((n,i)=>`\u003cspan style=\"font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 7px;color:var(--muted)\">${i+1}. ${APPS[i].name}\u003c/span>`).join('')}\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Share by Token Volume\u003c/h2>\n      \u003cp class=\"desc\">Aggregated across all top apps this month.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(creatorTotals).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=allTok?Math.round(t/allTok*100):0;\n          if(pct\u003c1) return '';\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:110px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:18px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction showApp(app,el) {\n  setActive(el);\n  const cd={};\n  (app.models||[]).forEach(m=>{cd[m.creator]=(cd[m.creator]||0)+m.tokens;});\n  const total=(app.models||[]).reduce((s,m)=>s+m.tokens,0)||1;\n  const top=app.models?.[0]||{name:'?',creator:'other'};\n\n  document.getElementById('main-panel').innerHTML=`\n    \u003cdiv class=\"app-header\">\u003cdiv>\n      \u003cdiv class=\"app-title\">#${app.rank} ${app.name}\u003c/div>\n      \u003cdiv class=\"app-desc\">${app.desc||''}\u003c/div>\n      \u003cdiv class=\"tags\">${(app.tags||[]).map(t=>`\u003cspan class=\"tag\">${t}\u003c/span>`).join('')}\u003c/div>\n      ${app.stale_from?`\u003cdiv class=\"stale\">model mix carried over from ${app.stale_from} \u2014 this app's page returned nothing on the last run\u003c/div>`:''}\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"stats-row\">\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Today\u003c/div>\u003cdiv class=\"s-value\">${app.todayTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">All-Time\u003c/div>\u003cdiv class=\"s-value\">${app.allTimeTokens||'\u2014'}\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Global Rank\u003c/div>\u003cdiv class=\"s-value rank\">#${app.rank}\u003c/div>\u003c/div>\n      ${app.trend?`\u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Weekly Trend\u003c/div>\u003cdiv class=\"s-value\" style=\"color:${app.trend.startsWith('-')?'#f87171':'#4ade80'}\">${app.trend}\u003c/div>\u003c/div>`:''}\n      \u003cdiv class=\"stat-box\">\u003cdiv class=\"s-label\">Top Model\u003c/div>\n        \u003cdiv class=\"s-value\" style=\"font-size:14px;color:${CREATORS[top.creator]||'#fff'}\">${top.name}\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"chart-wrap\">\n      \u003ch2>Top ${(app.models||[]).length} Models This Month\u003c/h2>\n      \u003cp class=\"desc\">Token volume by model. Colors indicate AI lab.\u003c/p>\n      ${(app.models||[]).length===0?'\u003cdiv class=\"no-data\">No model data scraped for this app.\u003c/div>':''}\n      \u003cdiv class=\"bar-list\" id=\"app-chart\">\u003c/div>\n      \u003cdiv class=\"legend\" id=\"creator-legend\">\u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:16px\" class=\"heatmap-wrap\">\n      \u003ch2>Creator Mix\u003c/h2>\n      \u003cp class=\"desc\">Share of token volume by AI lab.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n        ${Object.entries(cd).sort((a,b)=>b[1]-a[1]).map(([c,t])=>{\n          const pct=Math.round(t/total*100);\n          return `\u003cdiv style=\"background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:100px\">\n            \u003cdiv style=\"font-size:12px;color:${CREATORS[c]||'#999'};text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px\">${c}\u003c/div>\n            \u003cdiv style=\"font-size:20px;font-weight:700\">${pct}%\u003c/div>\n            \u003cdiv style=\"margin-top:4px;height:3px;background:var(--border);border-radius:2px\">\n              \u003cdiv style=\"width:${pct}%;height:100%;background:${CREATORS[c]||'#555'};border-radius:2px\">\u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">${fmtT(t)}\u003c/div>\n          \u003c/div>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/div>`;\n\n  const chartEl=document.getElementById('app-chart');\n  if(!chartEl) return;\n  const maxT=Math.max(...(app.models||[]).map(m=>m.tokens))||1;\n  chartEl.innerHTML=(app.models||[]).map(m=>{\n    const pct=Math.round((m.tokens/maxT)*100);\n    const col=CREATORS[m.creator]||'#555';\n    const lbl=fmtT(m.tokens);\n    return `\u003cdiv class=\"bar-row\">\n      \u003cdiv class=\"bar-label\" title=\"${m.name}\">${m.name}\u003c/div>\n      \u003cdiv class=\"bar-track\">\n        \u003cdiv class=\"bar-fill\" style=\"width:${pct}%;background:${col}cc;border:1px solid ${col}44\">\n          ${pct>20?`\u003cspan class=\"bar-fill-label\">${lbl}\u003c/span>`:''}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"bar-value\">${pct\u003c=20?lbl:''}\n        \u003cspan style=\"color:${col};font-size:12.5px;margin-left:4px\">${m.creator}\u003c/span>\u003c/div>\n    \u003c/div>`;\n  }).join('');\n\n  const lgd=document.getElementById('creator-legend');\n  if(lgd) lgd.innerHTML=[...new Set((app.models||[]).map(m=>m.creator))].map(c=>\n    `\u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-dot\" style=\"background:${CREATORS[c]||'#555'}\">\u003c/div>${c}\u003c/div>`\n  ).join('');\n}\n\nrenderSidebar();\nshowOverview(document.querySelector('.overview-item'));\n\u003c/script>\n\u003c/body>\u003c/html>"</script>
<script>
  const parse=id=>JSON.parse(document.getElementById(id).textContent);
  document.getElementById('f-model').srcdoc=parse('d-model');
  document.getElementById('f-apps').srcdoc=parse('d-apps');
  const frames={model:document.getElementById('f-model'),apps:document.getElementById('f-apps')};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    Object.values(frames).forEach(f=>f.classList.remove('on'));
    frames[b.dataset.t].classList.add('on');
  });
</script>
</body></html>
